<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spaceship · RISE Space</title>
<meta name="description" content="RISE Space flies passengers to space aboard a spaceship lifted by a Space Balloon. Hours at 100,000 ft, the largest windows ever flown to space, and a gentle, carbon-neutral flight from a marine spaceport.">
<meta name="theme-color" content="#05070C">
<meta property="og:type" content="website">
<meta property="og:title" content="Spaceship · RISE Space">
<meta property="og:description" content="RISE Space flies passengers to space aboard a spaceship lifted by a Space Balloon. Hours at 100,000 ft, the largest windows ever flown to space, and a gentle, carbon-neutral flight from a marine spaceport.">
<meta property="og:image" content="assets/invite.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preload" as="image" href="assets/capsule-hangar-poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#05070C}
a{color:#F2EFE9}a:hover{color:#F7CC2E}
.sf{--gold:#F7CC2E;--void:#05070C;--ink:#0A0D14;--ink2:#0E121A;--bone:#F2EFE9;--dim:#A3A8B1;--mute:#6E7480;--sky:#9FC8E0;--line:rgba(242,239,233,.13);--gut:clamp(20px,5vw,84px);--serif:'Instrument Serif','Iowan Old Style',Georgia,serif;--sans:'Geist','Helvetica Neue',Helvetica,sans-serif;--mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;background:var(--void);color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip;position:relative}
.sf *{box-sizing:border-box}
.sf img,.sf video{display:block}
.sf h1,.sf h2,.sf h3,.sf p{margin:0}
.sf .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.22em;font-size:11px}
.sf .gold{color:var(--gold)}
.sf .ph{font-family:var(--mono);font-size:.86em;letter-spacing:.04em;color:var(--gold);background:rgba(247,204,46,.08);outline:1px dashed rgba(247,204,46,.55);outline-offset:2px;padding:0 .3em;white-space:nowrap}
.eyebrow{display:flex;align-items:center;gap:14px;color:var(--gold);margin-bottom:24px}
.eyebrow:before{content:"";width:28px;height:1px;background:var(--gold)}

/* ===== site navigation (shared across pages) ===== */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:28px;padding:16px var(--gut);transition:background .4s,box-shadow .4s,padding .4s;background:linear-gradient(180deg,rgba(5,7,12,.75),rgba(5,7,12,0))}
.nav[data-solid="1"]{background:rgba(5,7,12,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);padding-top:10px;padding-bottom:10px}
.nav-brand{display:flex;align-items:center;min-height:44px}
.nav-brand img{height:30px;width:auto}
.nav-links{display:flex;align-items:center;gap:6px;margin-left:18px}
.nav-link{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;font-size:13.5px;letter-spacing:.03em;text-decoration:none;color:rgba(242,239,233,.78);transition:color .25s}
.nav-link:after{content:"";position:absolute;left:12px;right:12px;bottom:8px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.16,.8,.2,1)}
a.nav-link:hover{color:var(--bone)}
a.nav-link:hover:after,.nav-link[aria-current="page"]:after{transform:scaleX(1)}
.nav-link[aria-current="page"]{color:var(--bone)}
.nav-link.is-soon{color:rgba(242,239,233,.42);cursor:default}
.nav-link em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border:1px solid rgba(242,239,233,.16);border-radius:999px;padding:2px 6px}
.nav-cta{margin-left:auto;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid rgba(247,204,46,.6);border-radius:999px;font-size:13px;letter-spacing:.04em;text-decoration:none;color:var(--bone);transition:background .25s,color .25s}
.nav-cta i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.nav-cta:hover{background:var(--gold);color:#05070C}
.nav-cta:hover i{background:#05070C;box-shadow:none}
.nav-burger{display:none;position:relative;width:46px;height:46px;border:1px solid rgba(242,239,233,.24);border-radius:50%;background:rgba(5,7,12,.4);cursor:pointer}
.nav-burger i{position:absolute;left:14px;right:14px;height:1px;background:var(--bone);transition:transform .35s,top .35s}
.nav-burger i:nth-child(1){top:19px}.nav-burger i:nth-child(2){top:26px}
.nav-burger[aria-expanded="true"] i:nth-child(1){top:22px;transform:rotate(45deg)}
.nav-burger[aria-expanded="true"] i:nth-child(2){top:22px;transform:rotate(-45deg)}
.sheet{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:96px var(--gut) 40px;background:radial-gradient(90% 60% at 80% 0%,rgba(98,180,255,.12),rgba(98,180,255,0) 60%),#05070C;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.sheet[data-open="true"]{opacity:1;visibility:visible}
.sheet a,.sheet span.s{font-family:var(--serif);font-size:clamp(38px,9vw,64px);line-height:1.15;text-decoration:none;color:var(--bone);display:flex;align-items:baseline;gap:14px;transform:translateY(16px);opacity:0;transition:transform .5s cubic-bezier(.16,.8,.2,1),opacity .5s}
.sheet[data-open="true"] a,.sheet[data-open="true"] span.s{transform:none;opacity:1}
.sheet span.s{color:rgba(242,239,233,.35)}
.sheet small{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sheet .nav-cta{margin:34px 0 0;align-self:flex-start;font-family:var(--sans);font-size:14px}
@media (max-width:980px){.nav-links,.nav>.nav-cta{display:none}.nav-burger{display:block;margin-left:auto}.nav-brand img{height:24px}}
@media (min-width:981px){.sheet{display:none}}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;gap:12px;min-height:50px;padding:0 26px;border:1px solid rgba(242,239,233,.32);border-radius:999px;text-decoration:none;font-family:var(--sans);font-size:14px;letter-spacing:.03em;color:var(--bone);background:transparent;cursor:pointer;transition:background .25s,border-color .25s,color .25s,transform .25s}
.btn:hover{border-color:var(--gold);background:rgba(247,204,46,.08);color:var(--bone)}
.btn.solid{background:var(--gold);border-color:var(--gold);color:#05070C;font-weight:500}
.btn.solid:hover{background:#FFE07A;color:#05070C}
.btn svg{width:16px;height:16px}

/* ===== reveal on scroll ===== */
[data-reveal]{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.16,.8,.2,1)}
[data-reveal][data-in="1"]{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){[data-reveal]{opacity:1;transform:none;transition:none}}

/* ===== hero ===== */
.hero{position:relative;min-height:clamp(640px,92svh,980px);display:flex;align-items:flex-end;overflow:hidden;padding:140px var(--gut) clamp(60px,10vh,110px)}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);animation:heroPush 24s ease-in-out infinite alternate}
@keyframes heroPush{to{transform:scale(1.12)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,12,.85) 0%,rgba(5,7,12,.35) 55%,rgba(5,7,12,.1) 100%),linear-gradient(180deg,rgba(5,7,12,.6) 0%,rgba(5,7,12,0) 30%,rgba(5,7,12,0) 60%,#05070C 100%)}
.hero-in{position:relative;z-index:1;max-width:820px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,8.4vw,144px);line-height:.9;letter-spacing:-.02em;text-wrap:balance;animation:rise 1.2s .15s cubic-bezier(.16,.8,.2,1) both}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero .lede{margin-top:28px;font-size:clamp(16px,1.4vw,20px);line-height:1.6;color:rgba(242,239,233,.84);max-width:46ch;animation:rise 1.2s .35s cubic-bezier(.16,.8,.2,1) both}
.hero .eyebrow{animation:rise 1s 0s cubic-bezier(.16,.8,.2,1) both}
.hero .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px;animation:rise 1.2s .5s cubic-bezier(.16,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hero-tag{position:absolute;z-index:1;right:var(--gut);bottom:clamp(60px,10vh,110px);color:rgba(242,239,233,.55);display:flex;align-items:center;gap:10px}
.hero-tag:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:760px){.hero-tag{display:none}}

/* ===== stats ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));margin:0 var(--gut);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:34px 26px 34px 0;border-right:1px solid var(--line);margin-right:26px}
.stat:last-child{border-right:0}
.stat .n{font-family:var(--serif);font-size:clamp(46px,4.6vw,76px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .n small{font-size:.42em;color:var(--dim);margin-left:6px;letter-spacing:0}
.stat p{margin-top:12px;font-size:14px;line-height:1.5;color:var(--dim);max-width:24ch}
@media (max-width:760px){.stat{border-right:0;margin-right:0;border-bottom:1px solid var(--line);padding:26px 0}.stat:last-child{border-bottom:0}}

/* ===== section heads ===== */
.sec{padding:clamp(100px,14vh,170px) var(--gut) 0}
.head{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:24px 60px;align-items:end;margin-bottom:clamp(44px,7vh,80px)}
.head h2{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5.4vw,92px);line-height:.95;letter-spacing:-.02em;text-wrap:balance}
.head p{font-size:clamp(16px,1.3vw,19px);line-height:1.6;color:var(--dim);max-width:46ch}

/* ===== onboard cards ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:18px}
.card{position:relative;min-height:460px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;outline:none}
.card img,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.02);transition:transform 1.4s cubic-bezier(.16,.8,.2,1),filter .6s}
.card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,7,12,.05) 30%,rgba(5,7,12,.92) 100%);transition:background .6s}
.card:hover img,.card:hover video,.card:focus-within img{transform:scale(1.09)}
.card .t{padding:26px}
.card .mono{color:var(--gold)}
.card h3{font-family:var(--serif);font-weight:400;font-size:clamp(30px,2.4vw,40px);line-height:1;margin-top:12px}
.card p{font-size:14.5px;line-height:1.55;color:rgba(242,239,233,.78);max-height:0;opacity:0;overflow:hidden;transition:max-height .6s cubic-bezier(.16,.8,.2,1),opacity .5s,margin .6s}
.card:hover p,.card:focus-within p{max-height:120px;opacity:1;margin-top:12px}
@media (hover:none){.card p{max-height:none;opacity:1;margin-top:12px}}
.card .line{position:absolute;left:26px;right:26px;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.16,.8,.2,1)}
.card:hover .line{transform:scaleX(1)}

/* ===== safety band ===== */
.safe{position:relative;margin-top:clamp(100px,14vh,170px);overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:center;gap:40px;padding:clamp(70px,10vh,120px) var(--gut);min-height:620px}
.safe .bg{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:75% 50%}
.safe:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,7,12,.9),rgba(5,7,12,.55) 38%,rgba(5,7,12,0) 62%),linear-gradient(180deg,#05070C,rgba(5,7,12,0) 14%,rgba(5,7,12,0) 86%,#05070C)}
.safe .ref{position:absolute;right:var(--gut);bottom:clamp(24px,4vh,40px);color:rgba(242,239,233,.7);display:flex;gap:10px;align-items:center}
.safe .ref:before{content:"";width:18px;height:1px;background:var(--gold)}
@media (max-width:860px){.safe{padding-top:0;gap:28px}.safe:before{display:none}.safe .bg{position:relative;inset:auto;z-index:0;order:-1;width:calc(100% + 2 * var(--gut));height:auto;aspect-ratio:16/10;margin:0 calc(-1 * var(--gut));object-position:80% 50%}.safe .ref{top:calc(62.5vw - 40px);bottom:auto}}
.safe h2{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5vw,84px);line-height:.95;letter-spacing:-.02em;max-width:14ch}
.safe p{margin-top:24px;font-size:clamp(16px,1.3vw,19px);line-height:1.6;color:rgba(242,239,233,.82);max-width:44ch}
.safe ul{list-style:none;margin:30px 0 0;padding:0;max-width:560px}
.safe li{display:flex;gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);font-size:15px;color:#D5D8DE}
.safe li b{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.18em;color:var(--gold)}
.safe .balloon{justify-self:center;height:min(560px,70vh);width:auto;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6));animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
@media (max-width:860px){.safe{grid-template-columns:minmax(0,1fr)}.safe .balloon{display:none}}

/* ===== faq ===== */
.faq{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px 80px;align-items:start}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:76px;padding:18px 0;cursor:pointer;font-family:var(--serif);font-size:clamp(22px,2vw,30px);line-height:1.15}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{position:relative;flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid rgba(242,239,233,.24);transition:transform .4s,border-color .3s,background .3s}
.faq summary i:before,.faq summary i:after{content:"";position:absolute;left:11px;right:11px;top:17px;height:1px;background:var(--bone)}
.faq summary i:after{transform:rotate(90deg);transition:transform .4s}
.faq details[open] summary i{border-color:var(--gold);background:rgba(247,204,46,.1)}
.faq details[open] summary i:after{transform:rotate(0)}
.faq summary:hover{color:var(--gold)}
.faq .a{padding:0 60px 26px 0;font-size:16px;line-height:1.65;color:var(--dim);animation:rise .5s ease both}
@media (max-width:860px){.faq{grid-template-columns:minmax(0,1fr)}.faq .a{padding-right:0}}

/* ===== join ===== */
.join{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(480px,100%),1fr));border:1px solid var(--line);margin-top:clamp(100px,14vh,170px)}
.join .shot{position:relative;min-height:520px;overflow:hidden}
.join .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 8s ease}
.join:hover .shot img{transform:scale(1.06)}
.join .body{padding:clamp(30px,4vw,64px);display:flex;flex-direction:column;justify-content:center;background:var(--ink)}
.join h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.2vw,70px);line-height:.96;letter-spacing:-.02em}
.join .body>p{margin-top:20px;font-size:16px;line-height:1.6;color:var(--dim);max-width:44ch}
.form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin-top:30px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.field input,.field select{min-height:52px;padding:0 16px;background:rgba(242,239,233,.03);border:1px solid rgba(242,239,233,.22);border-radius:2px;color:var(--bone);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .25s}
.field select option{background:#0A0D14}
.field input:focus,.field select:focus{border-color:var(--gold)}
.form .full{grid-column:1 / -1}
.form .btn{align-self:end}
.ok{margin-top:22px;display:flex;align-items:center;gap:12px;color:var(--gold);animation:rise .6s ease both}
.ok b{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#05070C}
.ok b svg{width:14px;height:14px}
.fine{margin-top:16px;font-size:13px;color:var(--mute)}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}

/* ===== footer (shared) ===== */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:26px 40px;padding:70px var(--gut) 40px;margin-top:clamp(100px,14vh,160px);border-top:1px solid var(--line)}
.foot .logo{height:40px;width:auto;margin-right:auto}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 26px}
.foot nav a,.foot nav span{font-size:14px;text-decoration:none;color:var(--dim);padding:10px 0}
.foot nav span{color:var(--mute)}
.foot nav a:hover{color:var(--bone)}
.legal{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:24px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:30px;border-top:1px solid var(--line)}
.legal a{color:var(--mute);text-decoration:none}
.legal a:hover{color:var(--bone)}
.social{flex:0 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:28px;border-top:1px solid var(--line)}
.social .mono{color:var(--mute);margin-right:10px}
.soc{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid rgba(242,239,233,.2);color:var(--dim);text-decoration:none;transition:color .25s,border-color .25s,background .25s,transform .25s}
.soc svg{width:18px;height:18px}
.soc:hover{color:#05070C;background:var(--gold);border-color:var(--gold);transform:translateY(-2px)}
.soc.todo{cursor:default}
.social + .legal{border-top:0;padding-top:20px}
@media (max-width:560px){.social .mono{flex:0 0 100%;margin:0 0 6px}}

/* ===== page: Spaceship ===== */
.hero.short{min-height:clamp(560px,78svh,860px)}
.hero .hero-in{max-width:880px}
.split2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(480px,100%),1fr));gap:0;border:1px solid var(--line)}
.split2 .media{position:relative;min-height:460px;background:#000;overflow:hidden}
.split2 .media video,.split2 .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.split2 .txt{padding:clamp(28px,4vw,60px);display:flex;flex-direction:column;justify-content:center;background:var(--ink)}
.split2 h3{font-family:var(--serif);font-weight:400;font-size:clamp(36px,3.6vw,60px);line-height:.98;letter-spacing:-.015em}
.split2 p{margin-top:18px;font-size:16px;line-height:1.65;color:var(--dim);max-width:44ch}
.list{list-style:none;margin:26px 0 0;padding:0}
.list li{display:flex;gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);font-size:15px;color:#D5D8DE}
.list li:last-child{border-bottom:1px solid var(--line)}
.list li b{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.18em;color:var(--gold);min-width:24px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:46px;padding:0 20px;border:1px solid rgba(242,239,233,.2);border-radius:999px;background:transparent;color:var(--dim);font-family:var(--sans);font-size:14px;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.tab:hover{color:var(--bone);border-color:rgba(242,239,233,.45)}
.tab[aria-selected="true"]{background:var(--bone);color:#05070C;border-color:var(--bone)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;border:1px solid rgba(242,239,233,.26);background:rgba(5,7,12,.4);color:var(--bone);cursor:pointer;transition:border-color .25s,background .25s}
.icon-btn:hover{border-color:var(--gold);background:rgba(247,204,46,.1)}
.icon-btn svg{width:18px;height:18px}
.textlink{display:inline-flex;align-items:center;gap:10px;margin-top:26px;color:var(--bone);text-decoration:none;font-size:14px;letter-spacing:.03em;border-bottom:1px solid rgba(247,204,46,.5);padding-bottom:6px;align-self:flex-start;transition:gap .3s,color .3s}
.textlink:hover{gap:16px;color:var(--gold)}
.textlink svg{width:16px;height:16px}

.hero:after{background:linear-gradient(90deg,rgba(5,7,12,.55) 0%,rgba(5,7,12,.14) 42%,rgba(5,7,12,0) 66%),linear-gradient(180deg,rgba(5,7,12,.38) 0%,rgba(5,7,12,0) 20%,rgba(5,7,12,0) 70%,#05070C 100%)}
.hero h1,.hero .lede{text-shadow:0 2px 24px rgba(5,7,12,.55)}
.explore{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);background:radial-gradient(70% 70% at 35% 45%,rgba(98,180,255,.14),rgba(98,180,255,0) 70%),linear-gradient(180deg,#070A12,#0B1424)}
.craftbox{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(150px,15vw,190px) 30px 50px;min-height:700px}
.capsule{position:relative;width:min(360px,64%);aspect-ratio:471/564}
.capsule img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .9s ease,transform 1.2s cubic-bezier(.16,.8,.2,1);filter:drop-shadow(0 40px 60px rgba(0,0,0,.6))}
.capsule img[data-on="false"]{opacity:0;transform:scale(.97)}
.capsule .floaty{position:absolute;inset:0;animation:float 7s ease-in-out infinite}
.cables{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.cables line{stroke:rgba(242,239,233,.45);stroke-width:1.2;vector-effect:non-scaling-stroke}
@keyframes float{50%{transform:translateY(-12px)}}
.spot{position:absolute;z-index:2;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:0;background:none;cursor:pointer;padding:0}
.spot i{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--bone);box-shadow:0 0 0 4px rgba(242,239,233,.18);transition:background .3s,box-shadow .3s,transform .3s}
.spot:before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(242,239,233,.6);animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}
.spot:hover i{transform:scale(1.2)}
.spot[aria-pressed="true"] i{background:var(--gold);box-shadow:0 0 0 6px rgba(247,204,46,.2),0 0 24px rgba(247,204,46,.7)}
.spot[aria-pressed="true"]:before{border-color:var(--gold)}
.spot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.detail{padding:clamp(28px,4vw,60px);display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line)}
.detail .count{color:var(--mute);margin-bottom:22px}
.detail-item{display:none}
.detail-item[data-on="true"]{display:block;animation:rise .7s cubic-bezier(.16,.8,.2,1) both}
.detail-item .k{color:#9FC8E0;display:block;margin-bottom:14px}
.detail-item h3{font-family:var(--serif);font-weight:400;font-size:clamp(36px,3.5vw,60px);line-height:.98;letter-spacing:-.015em}
.detail-item p{margin-top:18px;font-size:16px;line-height:1.65;color:rgba(242,239,233,.82);max-width:42ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chips span{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:#C9CDD4}
.spot-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.spot-list button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--dim);font-family:var(--sans);font-size:13px;cursor:pointer;transition:color .3s,border-color .3s}
.spot-list button:hover{color:var(--bone)}
.spot-list button[aria-pressed="true"]{color:var(--gold);border-color:rgba(247,204,46,.6)}
@media (max-width:860px){.explore{grid-template-columns:minmax(0,1fr)}.detail{border-left:0;border-top:1px solid var(--line)}.craftbox{min-height:0;padding-bottom:40px}}
/* cabin explorer */
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.mpanel{display:none}
.mpanel[data-on="true"]{display:block;animation:rise .7s cubic-bezier(.16,.8,.2,1) both}
.cab{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);border:1px solid var(--line);background:var(--ink)}
.cabstage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.cabstage[data-drag="true"]{cursor:grabbing}
.cabstage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cabstage .hs{transition:opacity .4s ease,transform .4s ease}
.cabstage .hs[data-show="false"]{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.6)}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:999px;background:rgba(5,7,12,.55);border:1px solid rgba(242,239,233,.2);color:var(--bone);font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;pointer-events:none;transition:opacity .5s}
.hint svg{width:16px;height:16px;color:var(--gold)}
.hint[data-on="false"]{opacity:0}
.cabnav{position:absolute;right:16px;top:16px;display:flex;gap:8px;z-index:3}
.cab .detail{border-left:1px solid var(--line)}
.cab .spot-list{margin-top:26px}
@media (max-width:960px){.cab{grid-template-columns:minmax(0,1fr)}.cab .detail{border-left:0;border-top:1px solid var(--line)}}
.custom{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.custom{grid-template-columns:minmax(0,1fr)}}
.cc{border:1px solid var(--line);background:var(--ink);display:flex;flex-direction:column}
.cc .media{position:relative;aspect-ratio:16/10;overflow:hidden;background:#000}
.cc .media video,.cc .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:16px;top:16px;z-index:1;padding:7px 12px;border-radius:999px;background:rgba(5,7,12,.6);border:1px solid rgba(247,204,46,.55);color:var(--gold);font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.cc .t{padding:24px 26px 28px}
.cc h3{font-family:var(--serif);font-weight:400;font-size:clamp(28px,2.4vw,38px);line-height:1.02}
.cc p{margin-top:12px;font-size:15.5px;line-height:1.6;color:var(--dim);max-width:44ch}
.note{margin-top:18px;display:flex;gap:12px;align-items:baseline;font-size:14px;line-height:1.6;color:var(--dim)}
.note b{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
/* make your mark */
.mark{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);background:radial-gradient(60% 70% at 30% 50%,rgba(247,204,46,.08),rgba(247,204,46,0) 70%),linear-gradient(180deg,#070A12,#0B1424)}
.mark .craftbox{padding-top:56px;min-height:640px}
.mark .txt{padding:clamp(30px,4.4vw,72px);display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line)}
.mark h2{font-family:var(--serif);font-weight:400;font-size:clamp(42px,4.6vw,78px);line-height:.95;letter-spacing:-.02em}
.mark p{margin-top:22px;font-size:clamp(16px,1.3vw,19px);line-height:1.6;color:rgba(242,239,233,.82);max-width:42ch}
.mark .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.livery{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:34px}
.yourmark{position:absolute;left:22%;right:22%;top:62%;height:20%;display:flex;align-items:center;justify-content:center;border:1.5px dashed rgba(247,204,46,.85);border-radius:12px;color:#5f4800;font-weight:500;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:rgba(247,204,46,.1);transition:opacity .6s}
.yourmark[data-on="false"]{opacity:0}
@media (max-width:860px){.mark{grid-template-columns:minmax(0,1fr)}.mark .txt{border-left:0;border-top:1px solid var(--line)}.mark .craftbox{min-height:0}}
/* tallest */
.tallg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.5fr);border:1px solid var(--line);background:linear-gradient(180deg,#070A12,#0B1424)}
.tall{padding:clamp(18px,2.4vw,34px);overflow-x:auto}
.tall svg{display:block;width:100%;min-width:640px;height:auto}
.tall .grid line{stroke:rgba(242,239,233,.1);stroke-dasharray:3 6}
.tall .ground{stroke:rgba(242,239,233,.45)}
.tall .ln{fill:none;stroke:rgba(242,239,233,.78);stroke-width:1.4;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 2.2s cubic-bezier(.65,0,.35,1)}
.tall .ln.gold{stroke:var(--gold);stroke-width:1.8;filter:drop-shadow(0 0 6px rgba(247,204,46,.45))}
.tall .ln.faint{opacity:.35}
.tall .it .ln{transition-delay:var(--d)}
[data-in="1"] .tall .ln{stroke-dashoffset:0}
.tall text{font-family:var(--mono);font-size:12px;letter-spacing:.08em;fill:var(--mute);text-anchor:middle}
.tall .ht{fill:var(--bone)}
.tall .gl{text-anchor:start;font-size:10px;fill:rgba(242,239,233,.35)}
.tall .hi text{fill:var(--gold)}
.tallg .media{position:relative;min-height:420px;border-left:1px solid var(--line);overflow:hidden}
.slot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(70% 70% at 50% 40%,rgba(98,180,255,.12),rgba(98,180,255,0) 70%),linear-gradient(180deg,#0B1424,#070A12)}
.slot:before{content:"";position:absolute;inset:14px;border:1px dashed rgba(247,204,46,.35)}
.ref{position:absolute;left:18px;bottom:16px;z-index:2;display:flex;align-items:center;gap:10px;color:rgba(242,239,233,.82);text-shadow:0 1px 10px rgba(0,0,0,.7)}
.ref:before{content:"";width:18px;height:1px;background:var(--gold)}
@media (max-width:960px){.tallg{grid-template-columns:minmax(0,1fr)}.tallg .media{border-left:0;border-top:1px solid var(--line);min-height:0;aspect-ratio:4/3}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="sf" id="top" ref="{{ setRoot }}">

<!-- SITE NAVIGATION -->
<header class="nav" data-solid="0">
<a class="nav-brand" href="index.html" aria-label="RISE Space home"><img src="assets/logo.png" alt="RISE Space"></a>
<nav class="nav-links" aria-label="Primary">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
<sc-if value="{{ n.ready }}" hint-placeholder-val="{{ true }}"><a class="nav-link" href="{{ n.href }}" aria-current="{{ n.current }}">{{ n.label }}</a></sc-if>
<sc-if value="{{ n.soon }}" hint-placeholder-val="{{ false }}"><span class="nav-link is-soon" aria-disabled="true">{{ n.label }}<em>Soon</em></span></sc-if>
</sc-for>
</nav>
<a class="nav-cta" href="#reserve"><i></i>Reserve a seat</a>
<button class="nav-burger" type="button" aria-label="Menu" aria-controls="sf-menu" aria-expanded="{{ menuOpen }}" onClick="{{ toggleMenu }}"><i></i><i></i></button>
</header>
<div class="sheet" id="sf-menu" data-open="{{ menuOpen }}">
<a href="index.html" onClick="{{ closeMenu }}">Home</a>
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
<sc-if value="{{ n.ready }}" hint-placeholder-val="{{ true }}"><a href="{{ n.href }}" onClick="{{ closeMenu }}">{{ n.label }}</a></sc-if>
<sc-if value="{{ n.soon }}" hint-placeholder-val="{{ false }}"><span class="s">{{ n.label }} <small>Soon</small></span></sc-if>
</sc-for>
<a class="nav-cta" href="#reserve" onClick="{{ closeMenu }}"><i></i>Reserve a seat</a>
</div>

<!-- HERO -->
<section class="hero short" aria-label="The Spaceship">
<video data-loop="" src="assets/capsule-hangar.mp4" poster="assets/capsule-hangar-poster.jpg" autoplay="" loop="" muted="" playsinline=""></video>
<div class="hero-in">
<div class="mono eyebrow">The Spaceship</div>
<h1>Built for <em>the view.</em></h1>
<p class="lede">The largest capsule with the largest windows ever flown to space. Lifted gently by a Space Balloon, and designed, built and operated to rigorous FAA and NASA standards.</p>
<div class="btns"></div>
</div>
<div class="hero-tag mono">RISE Spaceship</div>
</section>

<!-- STATS -->
<div class="stats" data-reveal="">
<div class="stat"><div class="n"><span data-count="2144" data-fmt="comma"></span><small>cu ft</small></div><p>The largest-volume space capsule ever flown</p></div>
<div class="stat"><div class="n"><span data-count="16"></span><small>ft</small></div><p>Diameter of the spacious cabin</p></div>
<div class="stat"><div class="n"><span data-count="8"></span><small>+ captain</small></div><p>Passengers on every flight</p></div>
<div class="stat"><div class="n"><span data-count="360"></span><small>°</small></div><p>Panoramic views through 5.25 × 2 ft windows</p></div>
</div>

<!-- EXPLORER -->
<section class="sec" id="explore" aria-label="Explore the spaceship">
<div class="head" data-reveal="">
<div><div class="mono eyebrow">Explore</div><h2>Tap the spaceship.</h2></div>
<p>Select a point on the spaceship to see what makes it different.</p>
</div>
<div class="explore" data-reveal="">
<div class="craftbox">
<div class="capsule">
<div class="floaty">
<svg class="cables" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="21" y1="11" x2="50" y2="-34"></line><line x1="37" y1="3" x2="50" y2="-34"></line><line x1="63" y1="3" x2="50" y2="-34"></line><line x1="79" y1="11" x2="50" y2="-34"></line><line x1="50" y1="-34" x2="50" y2="-60"></line></svg>
<img src="assets/livery-signature.webp" alt="The RISE spaceship">
<sc-for list="{{ spots }}" as="s" hint-placeholder-count="8">
<button class="spot" type="button" style="left: {{ s.x }}; top: {{ s.y }}" aria-pressed="{{ s.on }}" aria-label="{{ s.title }}" onClick="{{ s.pick }}"><i></i></button>
</sc-for>
</div>
</div>
</div>
<div class="detail">
<div class="count mono"><span class="gold">{{ spotNum }}</span> / 08</div>
<div aria-live="polite">
<sc-for list="{{ spots }}" as="s" hint-placeholder-count="8">
<div class="detail-item" data-on="{{ s.on }}">
<span class="k mono">{{ s.kicker }}</span>
<h3>{{ s.title }}</h3>
<p>{{ s.body }}</p>
<div class="chips"><sc-for list="{{ s.chips }}" as="c" hint-placeholder-count="2"><span>{{ c }}</span></sc-for></div>
</div>
</sc-for>
</div>
<div class="spot-list">
<sc-for list="{{ spots }}" as="s" hint-placeholder-count="8">
<button type="button" aria-pressed="{{ s.on }}" onClick="{{ s.pick }}">{{ s.short }}</button>
</sc-for>
</div>
</div>
</div>
</section>

<!-- SPACE BALLOON -->
<section class="sec" aria-label="Space Balloon">
<div class="split2" data-reveal="">
<div class="media"><video data-loop="" src="assets/balloon-below.mp4" poster="assets/balloon-below-poster.jpg" autoplay="" loop="" muted="" playsinline=""></video></div>
<div class="txt">
<div class="mono eyebrow">Space Balloon</div>
<h3>The safe way to space.</h3>
<p>The spaceship is lifted by a Space Balloon. NASA and our team have flown thousands of balloon missions.</p>
<ul class="list">
<li><b>01</b><span>No rocket and no high g-forces</span></li>
<li><b>02</b><span>A smooth ascent at cycling speed</span></li>
<li><b>03</b><span>A carbon-neutral spaceflight</span></li>
<li><b>04</b><span>Floats on top of Earth’s atmosphere like an ice cube floats on water</span></li>
</ul>
<a class="textlink" href="spaceflight.html">See the full flight<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
</div>
</div>
</section>

<!-- CABIN -->
<section class="sec" id="interior" aria-label="The cabin">
<div class="head" data-reveal="">
<div><div class="mono eyebrow">The cabin</div><h2>A cabin made for looking out.</h2></div>
<p>Drag the cabin to look around, then tap a point to learn more. Seats for up to eight passengers and a captain, all wrapped in 360° of view.</p>
</div>
<div class="modes" role="tablist" aria-label="Cabin configuration" data-reveal="">
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
<button class="tab" type="button" role="tab" aria-selected="{{ m.on }}" onClick="{{ m.pick }}">{{ m.label }}</button>
</sc-for>
</div>
<div data-reveal="">
<div class="mpanel" data-on="{{ modeStd }}">
<div class="cab">
<div class="cabstage" data-cabstage="" data-drag="{{ cabMoving }}">
<video data-cabv="" src="assets/cabin-scrub.mp4" poster="assets/cabin-scrub-poster.jpg" muted="" playsinline="" preload="auto"></video>
<sc-for list="{{ feats }}" as="f" hint-placeholder-count="8">
<button class="spot hs" type="button" style="left: {{ f.x }}; top: {{ f.y }}" data-show="{{ f.show }}" aria-pressed="{{ f.on }}" aria-label="{{ f.title }}" onClick="{{ f.pick }}"><i></i></button>
</sc-for>
<div class="cabnav">
<button class="icon-btn" type="button" aria-label="Look left" onClick="{{ cabPrev }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button class="icon-btn" type="button" aria-label="Look right" onClick="{{ cabNext }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div class="hint" data-on="{{ cabHint }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5"></path><path d="M16 7l5 5-5 5"></path><path d="M3 12h18"></path></svg><span>Drag to look around</span></div>
</div>
<div class="detail">
<div class="count mono"><span class="gold">{{ featNum }}</span> / 08</div>
<div aria-live="polite">
<sc-for list="{{ feats }}" as="f" hint-placeholder-count="8">
<div class="detail-item" data-on="{{ f.on }}">
<span class="k mono">{{ f.kicker }}</span>
<h3>{{ f.title }}</h3>
<p>{{ f.body }}</p>
</div>
</sc-for>
</div>
<div class="spot-list">
<sc-for list="{{ feats }}" as="f" hint-placeholder-count="8">
<button type="button" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}">{{ f.short }}</button>
</sc-for>
</div>
</div>
</div>
</div>
<div class="mpanel" data-on="{{ modeCustom }}">
<div class="custom">
<article class="cc">
<div class="media"><video data-loop="" src="assets/lounge.mp4" poster="assets/lounge-poster.jpg" loop="" muted="" playsinline="" preload="none"></video><span class="badge">Custom</span></div>
<div class="t"><div class="mono eyebrow">Custom lounge</div><h3>An interior made for the occasion.</h3><p>The spaceship interior is customizable, from a relaxed lounge to a setting designed around your event.</p></div>
</article>
<article class="cc">
<div class="media"><img src="assets/v-dining.jpg" alt="A custom dining table set inside the RISE cabin"><span class="badge">Custom</span></div>
<div class="t"><div class="mono eyebrow">Custom dining</div><h3>A table above the clouds.</h3><p>A refreshments bar and a world-class culinary program, served in space.</p></div>
</article>
</div>
<p class="note"><b>Note</b><span>Custom interiors are configured for select flights and seat fewer than the standard eight passengers.</span></p>
</div>
</div>
</section>

<!-- MAKE YOUR MARK -->
<section class="sec" id="mark" aria-label="Make your mark">
<div class="mark" data-reveal="">
<div class="craftbox">
<div class="capsule">
<div class="floaty">
<img src="assets/livery-signature.webp" alt="The RISE spaceship in its signature livery" data-on="{{ liv0 }}">
<img src="assets/capsule-lit.webp" alt="The RISE spaceship with exterior lighting" data-on="{{ liv1 }}">
<img src="assets/livery-blank.webp" alt="The RISE spaceship as a blank canvas for your livery" data-on="{{ liv2 }}">
<div class="yourmark" data-on="{{ liv2 }}">Your mark here</div>
</div>
</div>
<div class="livery" role="group" aria-label="Livery">
<sc-for list="{{ liveries }}" as="l" hint-placeholder-count="3">
<button class="tab" type="button" aria-selected="{{ l.on }}" onClick="{{ l.pick }}">{{ l.label }}</button>
</sc-for>
</div>
</div>
<div class="txt">
<div class="mono eyebrow">Make it yours</div>
<h2>Make your mark on spaceflight.</h2>
<p>Custom livery and exterior lighting turn the spaceship into the most memorable canvas your brand has ever had, seen at launch, in every photo and on every broadcast from space. Switch the livery to imagine yours.</p>
<div class="btns"><a class="btn solid" href="space-venue.html">Learn more about Space Venue</a></div>
</div>
</div>
</section>

<!-- TALLEST LAUNCH VEHICLE -->
<section class="sec" aria-label="The tallest launch vehicle">
<div class="head" data-reveal="">
<div><div class="mono eyebrow">Scale</div><h2>The tallest launch vehicle.</h2></div>
<p>Standing over 600 ft tall on the launch pad, the spaceship is taller than any rocket and iconic landmarks including the Statue of Liberty and the Great Pyramid.</p>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, joined: false, spot: 0, livery: 0, cmode: 0, cfeat: 0, cstop: 0, cmoving: false, chint: true };
    this.root = null;
    this.setRoot = (el) => { this.root = el; };
    this.toggleMenu = () => this.setState({ menuOpen: !this.state.menuOpen });
    this.closeMenu = () => this.setState({ menuOpen: false });
    this.join = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ joined: true }); };
    this.pickSpot = (i) => () => this.setState({ spot: i });
    this.pickLivery = (i) => () => this.setState({ livery: i });
    this.pickMode = (i) => () => this.setState({ cmode: i });
    // cabin explorer: three viewpoints along the rotating cabin video, each with its own points
    this.cabStops = [0.05, 2.6, 3.6];
    this.cabFeats = [
      { stop: 0, short: 'Lounge', kicker: 'Standard cabin', title: 'The lounge', body: 'Comfortably seats 8 passengers and a captain in a relaxed environment wrapped in 360 degree panoramic views.', x: 41, y: 57 },
      { stop: 0, short: 'Space Spa', kicker: 'Behind the gray door', title: 'The Space Spa', body: 'A luxurious restroom with the best view in our solar system.', x: 55, y: 40 },
      { stop: 0, short: 'Flight readout', kicker: 'Overhead', title: 'Your flight, live', body: 'The readout above shows details about the flight as it happens: altitude, distance and where you are flying over.', x: 50, y: 7 },
      { stop: 0, short: 'Plants', kicker: 'Living cabin', title: 'We bring Earth with us', body: 'Living plants and fragrant herbs fill the cabin with a little of the planet you are looking down on.', x: 84, y: 69 },
      { stop: 1, short: 'Captain', kicker: 'At the helm', title: 'The captain', body: 'The captain sits behind the bar, next to the telescope.', x: 55, y: 49 },
      { stop: 1, short: 'Refreshments bar', kicker: 'Refreshments', title: 'The refreshments bar', body: 'A refreshments bar and a world-class culinary program, on every flight.', x: 46, y: 72 },
      { stop: 2, short: 'WiFi', kicker: 'Connected', title: 'Share it as it happens', body: 'WiFi for live streaming and posting on every flight, with information systems and customized playlists to create the mood.', x: 30, y: 34 },
      { stop: 2, short: 'Ambiance', kicker: 'Light and sound', title: 'The perfect ambiance', body: 'Dynamic lighting changes throughout the flight to optimize the view, and high-end sound systems create the perfect mood.', x: 64, y: 12 }
    ];
    this.pickFeat = (i) => () => { const f = this.cabFeats[i]; this.setState({ cfeat: i }); if (f.stop !== this.state.cstop) this.cabGo(f.stop); };
    this.cabPrev = () => this.cabGo((this.state.cstop + this.cabStops.length - 1) % this.cabStops.length, true);
    this.cabNext = () => this.cabGo((this.state.cstop + 1) % this.cabStops.length, true);
  }

  componentDidMount() {
    const root = this.root; if (!root) return;
    this.win = root.ownerDocument.defaultView || window;
    this.playLoops();
    if ('IntersectionObserver' in this.win) {
      this.io = new this.win.IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting) return;
          en.target.setAttribute('data-in', '1');
          Array.prototype.forEach.call(en.target.querySelectorAll('[data-count]'), (n) => this.countUp(n));
          this.io.unobserve(en.target);
        });
      }, { threshold: 0.15 });
      Array.prototype.forEach.call(root.querySelectorAll('[data-reveal]'), (n) => this.io.observe(n));
    } else {
      Array.prototype.forEach.call(root.querySelectorAll('[data-reveal]'), (n) => n.setAttribute('data-in', '1'));
    }
    this.onScroll = () => {
      const nav = root.querySelector('.nav');
      if (nav) { const solid = root.getBoundingClientRect().top < -40 ? '1' : '0'; if (nav.getAttribute('data-solid') !== solid) nav.setAttribute('data-solid', solid); }
      if (this.pageScroll) this.pageScroll();
    };
    this.win.addEventListener('scroll', this.onScroll, { capture: true, passive: true });
    this.onScroll();
    this.cabMount();
  }

  componentDidUpdate() { this.playLoops(); if (this.pageUpdate) this.pageUpdate(); }

  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    if (this.win && this.onScroll) this.win.removeEventListener('scroll', this.onScroll, true);
    if (this.pageUnmount) this.pageUnmount();
  }

  // every looping video that is showing plays; hidden ones (inactive tabs) pause
  playLoops() {
    if (!this.root) return;
    Array.prototype.forEach.call(this.root.querySelectorAll('video[data-loop]'), (v) => {
      v.muted = true; v.loop = true; v.playsInline = true; v.setAttribute('playsinline', '');
      const hidden = v.closest('[data-on="false"]');
      if (hidden) { if (!v.paused) v.pause(); return; }
      if (v.paused) { if (v.preload !== 'auto') v.preload = 'auto'; const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }
    });
  }

  countUp(n) {
    const end = parseFloat(n.getAttribute('data-count')); const comma = n.getAttribute('data-fmt') === 'comma';
    const t0 = performance.now(); const dur = 1600;
    const fmt = (x) => comma ? Math.round(x).toLocaleString('en-US') : String(Math.round(x));
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - k, 3);
      n.textContent = fmt(end * e);
      if (k < 1) this.win.requestAnimationFrame(step);
    };
    n.textContent = fmt(0);
    this.win.requestAnimationFrame(step);
  }

  cabVideo() { return this.root ? this.root.querySelector('[data-cabv]') : null; }

  // turn the cabin to a viewpoint; when pickFirst is set, select that viewpoint's first point
  cabGo(stop, pickFirst) {
    const v = this.cabVideo(); const target = this.cabStops[stop];
    const first = this.cabFeats.findIndex((f) => f.stop === stop);
    const next = { cstop: stop, chint: false };
    if (pickFirst || (this.cabFeats[this.state.cfeat] || {}).stop !== stop) next.cfeat = first;
    if (!v || !(v.readyState >= 1)) { this.setState(next); return; }
    if (this.cabAnim) this.win.cancelAnimationFrame(this.cabAnim);
    const from = v.currentTime; const t0 = performance.now(); const dur = Math.min(900, 250 + Math.abs(target - from) * 320);
    this.setState({ cmoving: true });
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur); const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      try { v.currentTime = from + (target - from) * e; } catch (err) {}
      if (k < 1) this.cabAnim = this.win.requestAnimationFrame(step);
      else { this.cabAnim = null; this.setState({ ...next, cmoving: false }); }
    };
    this.cabAnim = this.win.requestAnimationFrame(step);
  }

  cabMount() {
    const stage = this.root && this.root.querySelector('[data-cabstage]'); const v = this.cabVideo();
    if (!stage || !v) return;
    v.muted = true; v.playsInline = true; v.pause();
    const setT = () => { try { if (v.currentTime < 0.04) v.currentTime = this.cabStops[this.state.cstop]; } catch (e) {} };
    if (v.readyState >= 1) setT(); else v.addEventListener('loadedmetadata', setT, { once: true });
    let drag = null; let raf = null; let want = null;
    const apply = () => { raf = null; if (want != null) { try { v.currentTime = want; } catch (e) {} } };
    stage.addEventListener('pointerdown', (e) => {
      if (e.button > 0 || (e.target.closest && e.target.closest('button'))) return;
      if (this.cabAnim) { this.win.cancelAnimationFrame(this.cabAnim); this.cabAnim = null; }
      drag = { x: e.clientX, y: e.clientY, t: v.currentTime, w: stage.clientWidth || 1, moved: false, id: e.pointerId };
    });
    this.win.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x;
      if (!drag.moved) {
        if (Math.abs(dx) < 6) return;
        if (Math.abs(e.clientY - drag.y) > Math.abs(dx)) { drag = null; return; }   // a vertical swipe scrolls the page
        drag.moved = true; this.setState({ cmoving: true, chint: false });
        try { stage.setPointerCapture(drag.id); } catch (err) {}
      }
      const d = v.duration || 4.04;
      want = Math.max(0, Math.min(d - 0.05, drag.t - dx / drag.w * d * 1.1));
      if (!raf) raf = this.win.requestAnimationFrame(apply);
    });
    const end = () => {
      if (!drag) return; const moved = drag.moved; drag = null;
      if (!moved) return;
      const t = v.currentTime; let best = 0;
      this.cabStops.forEach((s, i) => { if (Math.abs(s - t) < Math.abs(this.cabStops[best] - t)) best = i; });
      this.cabGo(best);
    };
    this.win.addEventListener('pointerup', end);
    this.win.addEventListener('pointercancel', end);
  }

  renderVals() {
    return {
      setRoot: this.setRoot,
      nav: [
      { key: 'spaceflight', label: 'Spaceflight', href: 'spaceflight.html' },
      { key: 'spaceship', label: 'Spaceship', href: 'spaceship.html' },
      { key: 'venue', label: 'Space Venue', href: 'space-venue.html' },
      { key: 'programs', label: 'Space Programs', href: 'space-programs.html' },
      { key: 'about', label: 'About', href: 'about.html' },
      { key: 'shop', label: 'Shop', href: 'shop.html' }
    ].map((n) => ({ ...n, ready: true, soon: false, current: n.key === 'spaceship' ? 'page' : 'false' })),
      menuOpen: this.state.menuOpen,
      toggleMenu: this.toggleMenu,
      closeMenu: this.closeMenu,
      joined: this.state.joined,
      notJoined: !this.state.joined,
      join: this.join,
      spots: [
        { short: 'Space Balloon', kicker: 'Lift', title: 'Carried by a Space Balloon', body: 'A Space Balloon carries the spaceship to space at cycling speed, with no high g-forces and Earth’s gravity the entire flight. The spaceflight is carbon neutral.', chips: ['Cycling speed', 'Earth’s gravity', 'Carbon neutral'], x: 50, y: -24 },
        { short: 'Reserve Descent', kicker: 'Redundancy', title: 'Reserve Descent System', body: 'Redundant parachutes can safely land the spaceship anywhere from any altitude.', chips: ['Redundant parachutes', 'Any altitude'], x: 50, y: 5 },
        { short: 'Comfort', kicker: 'Life support', title: 'Built for total passenger comfort', body: 'Environmental control systems keep the cabin comfortable from liftoff to splashdown.', chips: ['Environmental control', 'Liftoff to splashdown'], x: 30, y: 14 },
        { short: 'Windows', kicker: '5.25 ft × 2 ft', title: 'The largest windows ever flown to space', body: 'Each window measures 5.25 by 2 feet, wrapping the cabin in 360° panoramic views of the Earth below.', chips: ['5.25 × 2 ft', '360° views'], x: 50, y: 38 },
        { short: 'Cabin', kicker: '16 ft diameter', title: 'The largest-volume capsule ever flown', body: 'A spacious 16 ft diameter cabin with 2,144 ft³ of pressurized interior for eight passengers and a captain.', chips: ['2,144 ft³', '8 + captain'], x: 75, y: 26 },
        { short: 'Standards', kicker: 'FAA · NASA', title: 'Regulated and built to rigorous standards', body: 'The spaceship is regulated by FAA’s Commercial Space Transportation, and designed, built and operated to rigorous NASA standards.', chips: ['FAA Commercial Space Transportation', 'NASA standards'], x: 26, y: 62 },
        { short: 'Splashcone', kicker: 'Splashdown', title: 'Splashcone for a gentle touchdown', body: 'The proprietary cone attenuates the splashdown, creating a slow and comfortable landing.', chips: ['Proprietary design', 'Soft splashdown'], x: 58, y: 84 },
        { short: 'Silence', kicker: 'Quiet', title: 'Silence', body: 'There is no sound from the graceful liftoff and throughout the flight, creating the calm space to soak in the view.', chips: ['No engine noise', 'Liftoff to splashdown'], x: 106, y: 46 }
      ].map((s, i) => ({ ...s, x: s.x + '%', y: s.y + '%', on: i === this.state.spot, pick: this.pickSpot(i) })),
      spotNum: '0' + (this.state.spot + 1),
      modes: ['Standard cabin', 'Custom interiors'].map((label, i) => ({ label, on: i === this.state.cmode, pick: this.pickMode(i) })),
      modeStd: this.state.cmode === 0,
      modeCustom: this.state.cmode === 1,
      feats: this.cabFeats.map((f, i) => ({ ...f, x: f.x + '%', y: f.y + '%', on: i === this.state.cfeat, show: f.stop === this.state.cstop && !this.state.cmoving, pick: this.pickFeat(i) })),
      featNum: '0' + (this.state.cfeat + 1),
      cabMoving: this.state.cmoving,
      cabHint: this.state.chint,
      cabPrev: this.cabPrev,
      cabNext: this.cabNext,
      liveries: ['Signature livery', 'Night lighting', 'Your mark here'].map((label, i) => ({ label, on: i === this.state.livery, pick: this.pickLivery(i) })),
      liv0: this.state.livery === 0,
      liv1: this.state.livery === 1,
      liv2: this.state.livery === 2,
    };
  }
}

mountArtboard('tpl', 'app', Component);
</script>
</body>
</html>
