<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spaceflight · RISE Space</title>
<meta name="description" content="RISE Space flies passengers to space aboard a spaceship lifted by a Space Balloon. Hours at 100,000 ft, the largest windows ever flown to space, and a gentle, carbon-neutral flight from a marine spaceport.">
<meta name="theme-color" content="#05070C">
<meta property="og:type" content="website">
<meta property="og:title" content="Spaceflight · RISE Space">
<meta property="og:description" content="RISE Space flies passengers to space aboard a spaceship lifted by a Space Balloon. Hours at 100,000 ft, the largest windows ever flown to space, and a gentle, carbon-neutral flight from a marine spaceport.">
<meta property="og:image" content="assets/invite.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preload" as="image" href="assets/poster-hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&amp;family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#05070C}
a{color:#F2EFE9}a:hover{color:#F7CC2E}
.sf{--gold:#F7CC2E;--hl:#9FD4FF;--hl-bg:rgba(120,190,255,.11);--void:#05070C;--ink:#0A0D14;--ink2:#0E121A;--bone:#F2EFE9;--dim:#A3A8B1;--mute:#6E7480;--sky:#9FC8E0;--line:rgba(242,239,233,.13);--gut:clamp(20px,5vw,84px);--serif:'Merriweather','Iowan Old Style',Georgia,serif;--sans:'Geist','Helvetica Neue',Helvetica,sans-serif;--mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;background:var(--void);color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip;position:relative}
.sf *{box-sizing:border-box}
.sf img,.sf video{display:block}
.sf h1,.sf h2,.sf h3,.sf p{margin:0}
.sf .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.22em;font-size:11px}
.sf .gold{color:var(--gold)}
.sf .ph{font-family:var(--mono);font-size:.86em;letter-spacing:.04em;color:var(--gold);background:rgba(247,204,46,.08);outline:1px dashed rgba(247,204,46,.55);outline-offset:2px;padding:0 .3em;white-space:nowrap}
.eyebrow{display:flex;align-items:center;gap:14px;color:var(--gold);margin-bottom:24px}
.eyebrow:before{content:"";width:28px;height:1px;background:var(--gold)}

/* ===== site navigation (shared across pages) ===== */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:28px;padding:16px var(--gut);transition:background .4s,box-shadow .4s,padding .4s;background:linear-gradient(180deg,rgba(5,7,12,.75),rgba(5,7,12,0))}
.nav[data-solid="1"]{background:rgba(5,7,12,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);padding-top:10px;padding-bottom:10px}
.nav-brand{display:flex;align-items:center;min-height:44px}
.nav-brand img{height:42px;width:auto}
.nav-links{display:flex;align-items:center;gap:6px;margin-left:18px}
.nav-link{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;font-size:13.5px;letter-spacing:.03em;text-decoration:none;color:rgba(242,239,233,.78);transition:color .25s}
.nav-link:after{content:"";position:absolute;left:12px;right:12px;bottom:8px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.16,.8,.2,1)}
a.nav-link:hover{color:var(--bone)}
a.nav-link:hover:after,.nav-link[aria-current="page"]:after{transform:scaleX(1)}
.nav-link[aria-current="page"]{color:var(--bone)}
.nav-link.is-soon{color:rgba(242,239,233,.42);cursor:default}
.nav-link em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border:1px solid rgba(242,239,233,.16);border-radius:999px;padding:2px 6px}
.nav-cta{margin-left:auto;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid rgba(247,204,46,.6);border-radius:999px;font-size:13px;letter-spacing:.04em;text-decoration:none;color:var(--bone);transition:background .25s,color .25s}
.nav-cta i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.nav-cta:hover{background:var(--gold);color:#05070C}
.nav-cta:hover i{background:#05070C;box-shadow:none}
.nav-burger{display:none;position:relative;width:46px;height:46px;border:1px solid rgba(242,239,233,.24);border-radius:50%;background:rgba(5,7,12,.4);cursor:pointer}
.nav-burger i{position:absolute;left:14px;right:14px;height:1px;background:var(--bone);transition:transform .35s,top .35s}
.nav-burger i:nth-child(1){top:19px}.nav-burger i:nth-child(2){top:26px}
.nav-burger[aria-expanded="true"] i:nth-child(1){top:22px;transform:rotate(45deg)}
.nav-burger[aria-expanded="true"] i:nth-child(2){top:22px;transform:rotate(-45deg)}
.sheet{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:96px var(--gut) 40px;background:radial-gradient(90% 60% at 80% 0%,rgba(98,180,255,.12),rgba(98,180,255,0) 60%),#05070C;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.sheet[data-open="true"]{opacity:1;visibility:visible}
.sheet a,.sheet span.s{font-family:var(--serif);font-size:clamp(38px,9vw,64px);line-height:1.15;text-decoration:none;color:var(--bone);display:flex;align-items:baseline;gap:14px;transform:translateY(16px);opacity:0;transition:transform .5s cubic-bezier(.16,.8,.2,1),opacity .5s}
.sheet[data-open="true"] a,.sheet[data-open="true"] span.s{transform:none;opacity:1}
.sheet span.s{color:rgba(242,239,233,.35)}
.sheet small{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sheet .nav-cta{margin:34px 0 0;align-self:flex-start;font-family:var(--sans);font-size:14px}
@media (max-width:980px){.nav-links,.nav>.nav-cta{display:none}.nav-burger{display:block;margin-left:auto}.nav-brand img{height:32px}}
@media (min-width:981px){.sheet{display:none}}

/* sound toggle */
.snd{position:fixed;right:clamp(16px,2vw,30px);bottom:clamp(16px,3vh,30px);z-index:60;display:flex;align-items:center;justify-content:center;gap:10px;height:48px;min-width:48px;padding:0 16px;border:1px solid rgba(242,239,233,.28);border-radius:999px;background:rgba(5,7,12,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--bone);cursor:pointer;transition:border-color .25s,background .25s}
.snd:hover{border-color:var(--gold);background:rgba(5,7,12,.8)}
.snd:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.snd svg{width:18px;height:18px;flex:0 0 auto}
.snd .eq{display:flex;align-items:flex-end;gap:2px;height:12px}
.snd .eq i{display:block;width:2px;height:100%;background:var(--gold);transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
.snd .eq i:nth-child(2){animation-delay:-.35s}
.snd .eq i:nth-child(3){animation-delay:-.7s}
.snd .eq i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.snd .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
@media (max-width:760px){.snd .lbl{display:none}}
@media (prefers-reduced-motion:reduce){.snd .eq i{animation:none;transform:scaleY(.6)}}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;gap:12px;min-height:50px;padding:0 26px;border:1px solid rgba(242,239,233,.32);border-radius:999px;text-decoration:none;font-family:var(--sans);font-size:14px;letter-spacing:.03em;color:var(--bone);background:transparent;cursor:pointer;transition:background .25s,border-color .25s,color .25s,transform .25s}
.btn:hover{border-color:var(--gold);background:rgba(247,204,46,.08);color:var(--bone)}
.btn.solid{background:var(--gold);border-color:var(--gold);color:#05070C;font-weight:500}
.btn.solid:hover{background:#FFE07A;color:#05070C}
.btn svg{width:16px;height:16px}

/* ===== reveal on scroll ===== */
[data-reveal]{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.16,.8,.2,1)}
[data-reveal][data-in="1"]{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){[data-reveal]{opacity:1;transform:none;transition:none}}

/* ===== hero ===== */
.hero{position:relative;min-height:clamp(640px,92svh,980px);display:flex;align-items:flex-end;overflow:hidden;padding:140px var(--gut) clamp(60px,10vh,110px)}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);animation:heroPush 24s ease-in-out infinite alternate}
@keyframes heroPush{to{transform:scale(1.12)}}
.hero:after{content:none;display:none}
.hero h1,.hero .lede,.hero .eyebrow,.hero-tag{text-shadow:0 2px 18px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5)}
.hero-in{position:relative;z-index:1;max-width:820px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,8.4vw,144px);line-height:1.1;letter-spacing:.005em;text-wrap:balance;animation:rise 1.2s .15s cubic-bezier(.16,.8,.2,1) both}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero .lede{margin-top:28px;font-size:clamp(16px,1.4vw,20px);line-height:1.6;color:rgba(242,239,233,.84);max-width:46ch;animation:rise 1.2s .35s cubic-bezier(.16,.8,.2,1) both}
.hero .eyebrow{animation:rise 1s 0s cubic-bezier(.16,.8,.2,1) both}
.hero .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px;animation:rise 1.2s .5s cubic-bezier(.16,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hero-tag{position:absolute;z-index:1;right:var(--gut);bottom:clamp(60px,10vh,110px);color:rgba(242,239,233,.55);display:flex;align-items:center;gap:10px}
.hero-tag:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:760px){.hero-tag{display:none}}

/* ===== stats ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));margin:0 var(--gut);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:34px 26px 34px 0;border-right:1px solid var(--line);margin-right:26px}
.stat:last-child{border-right:0}
.stat .n{font-family:var(--serif);font-size:clamp(46px,4.6vw,76px);line-height:1;letter-spacing:.005em;font-variant-numeric:tabular-nums}
.stat .n small{font-size:.42em;color:var(--dim);margin-left:6px;letter-spacing:0}
.stat p{margin-top:12px;font-size:14px;line-height:1.5;color:var(--dim);max-width:24ch}
@media (max-width:760px){.stat{border-right:0;margin-right:0;border-bottom:1px solid var(--line);padding:26px 0}.stat:last-child{border-bottom:0}}

/* ===== section heads ===== */
.sec{padding:clamp(100px,14vh,170px) var(--gut) 0}
.head{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:24px 60px;align-items:end;margin-bottom:clamp(44px,7vh,80px)}
.head h2{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5.4vw,92px);line-height:1.1;letter-spacing:.005em;text-wrap:balance}
.head p{font-size:clamp(16px,1.3vw,19px);line-height:1.6;color:var(--dim);max-width:46ch}

/* ===== interactive flight profile ===== */
.profile{position:relative;border:1px solid var(--line);background:#05070C;overflow:hidden}
.profile:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1px 1px at 12% 18%,rgba(242,239,233,.55),transparent 60%),radial-gradient(1px 1px at 27% 9%,rgba(242,239,233,.4),transparent 60%),radial-gradient(1px 1px at 44% 22%,rgba(242,239,233,.35),transparent 60%),radial-gradient(1px 1px at 63% 7%,rgba(242,239,233,.5),transparent 60%),radial-gradient(1px 1px at 78% 16%,rgba(242,239,233,.4),transparent 60%),radial-gradient(1px 1px at 91% 26%,rgba(242,239,233,.35),transparent 60%),radial-gradient(1px 1px at 35% 30%,rgba(242,239,233,.3),transparent 60%),radial-gradient(1px 1px at 86% 6%,rgba(242,239,233,.45),transparent 60%)}
.chart{position:relative;aspect-ratio:1000/320;margin:28px 34px 8px 96px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .grid line{stroke:rgba(242,239,233,.1);stroke-dasharray:3 6}
.chart .track{fill:none;stroke:rgba(242,239,233,.2);stroke-width:2;vector-effect:non-scaling-stroke}
.chart .done{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:1 1;stroke-dashoffset:calc(1 - var(--prog,0));transition:stroke-dashoffset 1.1s cubic-bezier(.65,0,.35,1);filter:drop-shadow(0 0 6px rgba(247,204,46,.6))}
.chart .area{fill:none}
.chart .ground{stroke:rgba(242,239,233,.35);stroke-width:1;vector-effect:non-scaling-stroke}
.ylab{position:absolute;left:-88px;width:76px;text-align:right;transform:translateY(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute)}
.tline{position:relative;height:58px;margin:18px 34px 22px 96px}
.tline .seg{position:absolute;top:0;height:10px;border:1px solid rgba(242,239,233,.28);border-bottom:0;display:flex;justify-content:center}
.tline .seg span{position:absolute;top:18px;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tline .seg b{font-weight:400;color:var(--bone);letter-spacing:.08em}
.tline .seg[data-on="true"]{border-color:var(--gold)}
.tline .seg[data-on="true"] span{color:var(--gold)}
.total{position:absolute;top:18px;right:34px;z-index:1;display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.total b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:0;text-transform:none;color:var(--gold)}
.pm{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--dim);font-family:var(--sans)}
.pm b{position:relative;width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(242,239,233,.55);background:#0B1424;transition:border-color .3s,background .3s,transform .3s}
.pm:hover b{border-color:var(--gold);transform:scale(1.15)}
.pm span{position:absolute;top:26px;white-space:nowrap;font-size:12.5px;letter-spacing:.02em;transition:color .3s}
.pm.up span{top:auto;bottom:26px}
.pm.l span{top:50%;right:26px;transform:translateY(-50%)}
.pm.r span{top:50%;left:26px;transform:translateY(-50%)}
.pm[aria-pressed="true"]{color:var(--bone)}
.pm[aria-pressed="true"] b{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 6px rgba(247,204,46,.16),0 0 24px rgba(247,204,46,.6)}
.pm:focus-visible{outline:none}
.pm:focus-visible b{outline:2px solid var(--gold);outline-offset:4px}
.craft{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;pointer-events:none;transition:left 1.1s cubic-bezier(.65,0,.35,1),top 1.1s cubic-bezier(.65,0,.35,1)}
.craft:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(247,204,46,.5);animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
@media (max-width:760px){.chart{margin:22px 14px 8px 58px;aspect-ratio:1000/560}.ylab{left:-56px;width:48px;font-size:9px}.pm span{display:none}.pm[aria-pressed="true"] span{display:block}.pm.r span{left:auto;right:26px}.tline{margin:14px 14px 18px 58px}.tline .seg span{font-size:8.5px;letter-spacing:.1em}.total{top:12px;right:14px}.total b{font-size:18px}}

.stage-panel{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);border-top:1px solid var(--line)}
.ph-media{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.ph-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .8s ease,transform 1.6s cubic-bezier(.16,.8,.2,1)}
.ph-media video[data-on="true"]{opacity:1;transform:none}
.ph-media .tag{position:absolute;left:18px;bottom:16px;color:rgba(242,239,233,.7);display:flex;gap:10px;align-items:center}
.ph-media .tag:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:blink 1.6s ease-in-out infinite}
.ph-text{position:relative;padding:clamp(26px,3.4vw,52px);display:flex;flex-direction:column}
.ph-text .count{color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:14px}
.ph-copy{position:relative;margin-top:26px;flex:1}
.ph-item{display:none}
.ph-item[data-on="true"]{display:block;animation:rise .8s cubic-bezier(.16,.8,.2,1) both}
.ph-item .k{color:var(--sky);margin-bottom:14px;display:block}
.ph-item h3{font-family:var(--serif);font-weight:400;font-size:clamp(38px,3.6vw,62px);line-height:1.1;letter-spacing:.005em}
.ph-item p{margin-top:18px;font-size:16px;line-height:1.65;color:rgba(242,239,233,.8);max-width:42ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chips .hl{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:0;border-radius:3px;background:var(--hl-bg);color:var(--hl);font-size:12.5px;letter-spacing:.01em;line-height:1.3}
.chips .hl:before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.8}
.ph-ctrl{display:flex;align-items:center;gap:10px;margin-top:28px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;border:1px solid rgba(242,239,233,.26);background:transparent;color:var(--bone);cursor:pointer;transition:border-color .25s,background .25s}
.icon-btn:hover{border-color:var(--gold);background:rgba(247,204,46,.08)}
.icon-btn svg{width:18px;height:18px}
.tour{margin-left:auto;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 4px;background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.tour:hover{color:var(--bone)}
.bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(242,239,233,.08)}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.bar i{animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes fillA{from{width:0}to{width:100%}}
@keyframes fillB{from{width:0}to{width:100%}}
@media (max-width:860px){.stage-panel{grid-template-columns:minmax(0,1fr)}}

/* ===== onboard cards ===== */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;min-height:460px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;outline:none}
.card img,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.02);transition:transform 1.4s cubic-bezier(.16,.8,.2,1),filter .6s}
.card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,7,12,.05) 30%,rgba(5,7,12,.92) 100%);transition:background .6s}
.card:hover img,.card:hover video,.card:focus-within img{transform:scale(1.09)}
.card .t{padding:26px}
.card .mono{color:var(--gold)}
.card h3{font-family:var(--serif);font-weight:400;font-size:clamp(30px,2.4vw,40px);line-height:1.1;margin-top:12px}
.card p{font-size:14.5px;line-height:1.55;color:rgba(242,239,233,.78);max-height:0;opacity:0;overflow:hidden;transition:max-height .6s cubic-bezier(.16,.8,.2,1),opacity .5s,margin .6s}
.card:hover p,.card:focus-within p{max-height:120px;opacity:1;margin-top:12px}
@media (hover:none){.card p{max-height:none;opacity:1;margin-top:12px}}
.card .line{position:absolute;left:26px;right:26px;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.16,.8,.2,1)}
.card:hover .line{transform:scaleX(1)}

/* ===== safety band ===== */
.safe{position:relative;margin-top:clamp(100px,14vh,170px);overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:center;gap:40px;padding:clamp(70px,10vh,120px) var(--gut);min-height:620px}
.safe .bg{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:75% 50%}
.safe:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,7,12,.9),rgba(5,7,12,.55) 38%,rgba(5,7,12,0) 62%),linear-gradient(180deg,#05070C,rgba(5,7,12,0) 14%,rgba(5,7,12,0) 86%,#05070C)}
.safe .ref{position:absolute;right:var(--gut);bottom:clamp(24px,4vh,40px);color:rgba(242,239,233,.7);display:flex;gap:10px;align-items:center}
.safe .ref:before{content:"";width:18px;height:1px;background:var(--gold)}
@media (max-width:860px){.safe{padding-top:0;gap:28px}.safe:before{display:none}.safe .bg{position:relative;inset:auto;z-index:0;order:-1;width:calc(100% + 2 * var(--gut));height:auto;aspect-ratio:16/10;margin:0 calc(-1 * var(--gut));object-position:80% 50%}.safe .ref{top:calc(62.5vw - 40px);bottom:auto}}
.safe h2{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5vw,84px);line-height:1.1;letter-spacing:.005em;max-width:14ch}
.safe p{margin-top:24px;font-size:clamp(16px,1.3vw,19px);line-height:1.6;color:rgba(242,239,233,.82);max-width:44ch}
.safe ul{list-style:none;margin:30px 0 0;padding:0;max-width:560px}
.safe li{display:flex;gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);font-size:15px;color:#D5D8DE}
.safe li b{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.18em;color:var(--gold)}
.safe .balloon{justify-self:center;height:min(560px,70vh);width:auto;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6));animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
@media (max-width:860px){.safe{grid-template-columns:minmax(0,1fr)}.safe .balloon{display:none}}

/* ===== faq ===== */
.faq{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px 80px;align-items:start}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:76px;padding:18px 0;cursor:pointer;font-family:var(--serif);font-size:clamp(22px,2vw,30px);line-height:1.15}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{position:relative;flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid rgba(242,239,233,.24);transition:transform .4s,border-color .3s,background .3s}
.faq summary i:before,.faq summary i:after{content:"";position:absolute;left:11px;right:11px;top:17px;height:1px;background:var(--bone)}
.faq summary i:after{transform:rotate(90deg);transition:transform .4s}
.faq details[open] summary i{border-color:var(--gold);background:rgba(247,204,46,.1)}
.faq details[open] summary i:after{transform:rotate(0)}
.faq summary:hover{color:var(--gold)}
.faq .a{padding:0 60px 26px 0;font-size:16px;line-height:1.65;color:var(--dim);animation:rise .5s ease both}
@media (max-width:860px){.faq{grid-template-columns:minmax(0,1fr)}.faq .a{padding-right:0}}


/* ===== join ===== */
.join{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(480px,100%),1fr));border:1px solid var(--line);margin-top:clamp(100px,14vh,170px)}
.join .shot{position:relative;min-height:520px;overflow:hidden}
.join .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 8s ease}
.join:hover .shot img{transform:scale(1.06)}
.join .body{padding:clamp(30px,4vw,64px);display:flex;flex-direction:column;justify-content:center;background:var(--ink)}
.join h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.2vw,70px);line-height:1.1;letter-spacing:.005em}
.join .body>p{margin-top:20px;font-size:16px;line-height:1.6;color:var(--dim);max-width:44ch}
.form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin-top:30px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.field input,.field select{min-height:52px;padding:0 16px;background:rgba(242,239,233,.03);border:1px solid rgba(242,239,233,.22);border-radius:2px;color:var(--bone);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .25s}
.field select option{background:#0A0D14}
.field input:focus,.field select:focus{border-color:var(--gold)}
.form .full{grid-column:1 / -1}
.form .btn{align-self:end}
.ok{margin-top:22px;display:flex;align-items:center;gap:12px;color:var(--gold);animation:rise .6s ease both}
.ok b{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#05070C}
.ok b svg{width:14px;height:14px}
.fine{margin-top:16px;font-size:13px;color:var(--mute)}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}

/* ===== footer (shared) ===== */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:26px 40px;padding:70px var(--gut) 40px;margin-top:clamp(100px,14vh,160px);border-top:1px solid var(--line)}
.foot .logo{height:40px;width:auto;margin-right:auto}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 26px}
.foot nav a,.foot nav span{font-size:14px;text-decoration:none;color:var(--dim);padding:10px 0}
.foot nav span{color:var(--mute)}
.foot nav a:hover{color:var(--bone)}
.legal{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:24px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:30px;border-top:1px solid var(--line)}
.legal a{color:var(--mute);text-decoration:none}
.legal a:hover{color:var(--bone)}
.social{flex:0 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:28px;border-top:1px solid var(--line)}
.social .mono{color:var(--mute);margin-right:10px}
.soc{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid rgba(242,239,233,.2);color:var(--dim);text-decoration:none;transition:color .25s,border-color .25s,background .25s,transform .25s}
.soc svg{width:18px;height:18px}
.soc:hover{color:#05070C;background:var(--gold);border-color:var(--gold);transform:translateY(-2px)}
.soc.todo{cursor:default}
.social + .legal{border-top:0;padding-top:20px}
@media (max-width:560px){.social .mono{flex:0 0 100%;margin:0 0 6px}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="sf" ref="{{ setRoot }}">

<!-- SITE NAVIGATION -->
<header class="nav" data-solid="0">
<a class="nav-brand" href="index.html" aria-label="RISE Space home"><img src="assets/rise-logo-nav.png" alt="RISE Space"></a>
<nav class="nav-links" aria-label="Primary">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
<sc-if value="{{ n.ready }}" hint-placeholder-val="{{ true }}"><a class="nav-link" href="{{ n.href }}" aria-current="{{ n.current }}">{{ n.label }}</a></sc-if>
<sc-if value="{{ n.soon }}" hint-placeholder-val="{{ false }}"><span class="nav-link is-soon" aria-disabled="true">{{ n.label }}<em>Soon</em></span></sc-if>
</sc-for>
</nav>
<a class="nav-cta" href="{{ joinHref }}"><i></i>Join Our Mission</a>
<button class="nav-burger" type="button" aria-label="Menu" aria-controls="sf-menu" aria-expanded="{{ menuOpen }}" onClick="{{ toggleMenu }}"><i></i><i></i></button>
</header>
<div class="sheet" id="sf-menu" data-open="{{ menuOpen }}">
<a href="index.html" onClick="{{ closeMenu }}">Home</a>
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
<sc-if value="{{ n.ready }}" hint-placeholder-val="{{ true }}"><a href="{{ n.href }}" onClick="{{ closeMenu }}">{{ n.label }}</a></sc-if>
<sc-if value="{{ n.soon }}" hint-placeholder-val="{{ false }}"><span class="s">{{ n.label }} <small>Soon</small></span></sc-if>
</sc-for>
<a class="nav-cta" href="{{ joinHref }}" onClick="{{ closeMenu }}"><i></i>Join Our Mission</a>
</div>

<audio data-bg="" src="assets/distant-starlight.mp3" loop="" preload="none"></audio>
<button class="snd" type="button" data-audio-btn="" onClick="{{ toggleSound }}" aria-label="{{ soundLabel }}" aria-pressed="{{ soundOff }}">
<sc-if value="{{ soundOn }}" hint-placeholder-val="{{ true }}">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></sc-if>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
</sc-if>
<sc-if value="{{ soundOff }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9.5l5 5"></path><path d="M22 9.5l-5 5"></path></svg>
<span class="lbl">Sound off</span>
</sc-if>
</button>

<!-- HERO -->
<section class="hero" aria-label="Spaceflight">
<video data-loop="" src="assets/apogee-hq.mp4" poster="assets/apogee-hq-poster.jpg" autoplay="" loop="" muted="" playsinline=""></video>
<div class="hero-in">
<div class="mono eyebrow">Spaceflight</div>
<h1>Your flight <em>to space.</em></h1>
<p class="lede">A gentle liftoff, hours in space, and a soft splashdown. No rocket. No high g-forces. A carbon-neutral spaceflight.</p>
</div>
<div class="hero-tag mono">Video captured during RISE spaceship flight</div>
</section>

<!-- STATS -->
<div class="stats" data-reveal="">
<div class="stat"><div class="n"><span data-count="100000" data-fmt="comma"></span><small>ft</small></div><p>Apogee for hours seeing Earth in the blackness of space</p></div>
<div class="stat"><div class="n"><span data-count="8"></span><small>+ captain</small></div><p>Passengers on every flight</p></div>
<div class="stat"><div class="n"><span data-count="340"></span><small>°</small></div><p>Panoramic views from the cabin</p></div>
<div class="stat"><div class="n">0<small>rockets</small></div><p>Lifted by a Space Balloon. The spaceflight is carbon neutral.</p></div>
</div>

<!-- FLIGHT PROFILE -->
<section class="sec" id="profile" aria-label="The flight, phase by phase">
<div class="head" data-reveal="">
<div><div class="mono eyebrow">The flight profile</div><h2>Five moments, one gentle flight.</h2></div>
<p>Tap any point on the flight path to see that part of the journey, filmed on RISE flights. Or let the tour play through on its own.</p>
</div>
<div class="profile" data-reveal="" style="--prog: {{ prog }}">
<div class="total"><span>Total flight</span><b>~6 hours</b></div>
<div class="chart">
<svg viewBox="0 0 1000 320" preserveAspectRatio="none" aria-hidden="true">
<defs><linearGradient id="sf-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7CC2E" stop-opacity=".14"></stop><stop offset="1" stop-color="#F7CC2E" stop-opacity="0"></stop></linearGradient></defs>
<g class="grid"><line x1="0" y1="52" x2="1000" y2="52"></line><line x1="0" y1="171" x2="1000" y2="171"></line><line x1="0" y1="290" x2="1000" y2="290"></line></g>
<path class="area" d="M40,290 C150,290 220,52 346.67,52 L653.33,52 C780,52 850,290 960,290 Z"></path>
<line class="ground" x1="0" y1="290" x2="1000" y2="290"></line>
<path class="track" d="M40,290 C150,290 220,52 346.67,52 L653.33,52 C780,52 850,290 960,290"></path>
<path class="done" pathLength="1" d="M40,290 C150,290 220,52 346.67,52 L653.33,52 C780,52 850,290 960,290"></path>
</svg>
<div class="ylab" style="top: 16.25%">100,000 ft</div>
<div class="ylab" style="top: 53.4%">50,000 ft</div>
<div class="ylab" style="top: 90.6%">Sea level</div>
<div class="craft" style="left: {{ craftX }}; top: {{ craftY }}"></div>
<sc-for list="{{ phases }}" as="p" hint-placeholder-count="5">
<button class="{{ p.cls }}" type="button" style="left: {{ p.x }}; top: {{ p.y }}" aria-pressed="{{ p.on }}" aria-label="{{ p.title }}" onClick="{{ p.pick }}"><b></b><span>{{ p.short }}</span></button>
</sc-for>
</div>
<div class="tline" aria-label="Flight timeline: about 2 hours up, 2 hours in space and 2 hours down, about 6 hours in total">
<div class="seg" data-on="{{ segUp }}" style="left: 4%; width: 30.667%"><span>Ascent<b>~2 hrs</b></span></div>
<div class="seg" data-on="{{ segTop }}" style="left: 34.667%; width: 30.667%"><span>In space<b>~2 hrs</b></span></div>
<div class="seg" data-on="{{ segDown }}" style="left: 65.333%; width: 30.667%"><span>Descent<b>~2 hrs</b></span></div>
</div>
<div class="stage-panel">
<div class="ph-media">
<sc-for list="{{ phases }}" as="p" hint-placeholder-count="5">
<video data-ph="{{ p.i }}" data-on="{{ p.on }}" src="{{ p.src }}" poster="{{ p.poster }}" muted="" loop="" playsinline="" preload="none"></video>
</sc-for>
<sc-if value="{{ showTag }}" hint-placeholder-val="{{ true }}"><div class="tag mono">RISE flight footage</div></sc-if>
</div>
<div class="ph-text">
<div class="count mono"><span><span class="gold">{{ num }}</span> / 05</span><span>{{ curShort }} · {{ curDur }}</span></div>
<div class="ph-copy" aria-live="polite">
<sc-for list="{{ phases }}" as="p" hint-placeholder-count="5">
<div class="ph-item" data-on="{{ p.on }}">
<span class="k mono">{{ p.kicker }}</span>
<h3>{{ p.title }}</h3>
<p>{{ p.body }}</p>
<div class="chips"><sc-for list="{{ p.chips }}" as="c" hint-placeholder-count="3"><span class="hl">{{ c }}</span></sc-for></div>
</div>
</sc-for>
</div>
<div class="ph-ctrl">
<button class="icon-btn" type="button" aria-label="Previous phase" onClick="{{ prev }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button class="icon-btn" type="button" aria-label="Next phase" onClick="{{ next }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="tour" type="button" onClick="{{ toggleTour }}" aria-pressed="{{ touring }}">{{ tourLabel }}</button>
</div>
<div class="bar" data-run="{{ touring }}"><i style="animation-name: {{ barAnim }}; animation-duration: {{ barDur }}"></i></div>
</div>
</div>
</div>
</section>

<!-- ONBOARD -->
<section class="sec" aria-label="Life onboard">
<div class="head" data-reveal="">
<div><div class="mono eyebrow">Onboard</div><h2>Hours worth staying for.</h2></div>
<p>A space lounge designed for the “overview effect,” the life-changing experience of seeing Earth in the vastness of space, in a lounge with the largest windows ever flown to space and the time to enjoy it with loved ones beside you.</p>
</div>
<div class="cards">
<article class="card" tabindex="0" data-reveal=""><img src="assets/card-flight-lounge.jpg" alt="Passengers toasting and taking photos at the windows of the RISE cabin" style="object-position: 20% 50%"><div class="t"><span class="mono">The view</span><h3>360° of Earth</h3><p>Up to eight passengers and a captain in the most roomy spaceship ever flown to space, with astonishing panoramic views of Earth in space.</p></div><i class="line"></i></article>
<article class="card" tabindex="0" data-reveal=""><img src="assets/dining-space.jpg" alt="A dining table set for four in the cabin, with Earth through the windows"><div class="t"><span class="mono">Dining</span><h3>A table above the clouds</h3><p>A refreshments bar and a world-class culinary program, with a full dining experience for select flights.</p></div><i class="line"></i></article>
<article class="card" tabindex="0" data-reveal=""><img src="assets/card-venue-dj2.jpg" alt="Two DJs playing a live broadcast from the RISE cabin" style="object-position: 52% 50%"><div class="t"><span class="mono">Live from space</span><h3>Share it as it happens</h3><p>WiFi for live streaming and posting on every flight so the people you love can see what you see. Global broadcasts of special events available.</p></div><i class="line"></i></article>
<article class="card" tabindex="0" data-reveal=""><img src="assets/spa.jpg" alt="The Space Spa restroom with a window to space"><div class="t"><span class="mono">Space Spa</span><h3>The best view in the solar system</h3><p>A luxurious restroom with a window onto the curve of the Earth.</p></div><i class="line"></i></article>
</div>
</section>

<!-- SAFETY -->
<section class="safe" aria-label="The safe way to space">
<img class="bg" src="assets/capsule-closeup.jpg" alt="The RISE spaceship in its hangar, its windows reflecting a sunset">
<div data-reveal="">
<div class="mono eyebrow">Safety features</div>
<h2>The safe way to space.</h2>
<p>The spaceship gently ascends and descends under a Space Balloon.</p>
<ul>
<li><b>01</b><span>Regulated by the FAA and designed, built and operated to rigorous NASA standards</span></li>
<li><b>02</b><span>NASA and our team members have flown thousands of Space Balloons</span></li>
<li><b>03</b><span>Splashdown is the safest way to land, as spacecraft have done since the dawn of human spaceflight</span></li>
<li><b>04</b><span>The Reserve Descent System can safely land the spaceship anywhere from any altitude</span></li>
</ul>
</div>
<div class="ref mono">RISE spaceship</div>
</section>

<!-- FAQ -->
<section class="sec" aria-label="Questions">
<div class="faq">
<div data-reveal=""><div class="mono eyebrow">Questions</div><h2 class="serif" style="font-family: var(--serif); font-weight: 400; font-size: clamp(44px, 5vw, 84px); line-height: .95; letter-spacing: -.02em">Before you fly.</h2><p style="margin-top: 22px; font-size: 16px; line-height: 1.6; color: #A3A8B1; max-width: 36ch">Short answers to what people ask first. A flight advisor can take you through the rest.</p></div>
<div data-reveal="">
<details open="open"><summary>How high does RISE fly?<i></i></summary><p class="a">Above 100,000 feet (30 km) above Earth, higher than 99% of the atmosphere. The sky is black, and the curve of the planet fills the windows.</p></details>
<details><summary>Is there a rocket?<i></i></summary><p class="a">No. The spaceship is lifted by a Space Balloon, so there are no high g-forces, and the spaceflight is carbon neutral.</p></details>
<details><summary>Is there gravity at apogee?<i></i></summary><p class="a">Yes. There is no risk of being disoriented by zero-g as there is Earth’s gravity the entire flight.</p></details>
<details><summary>Where do flights launch from?<i></i></summary><p class="a">From our marine spaceport. The spaceship lifts off from the deck of a ship, and you disembark on the ship’s deck within 15 minutes of splashdown.</p></details>
<details><summary>How many people are on a flight?<i></i></summary><p class="a">Up to eight passengers and a captain, in a 16 ft diameter cabin with 340° views (the remaining 20 degrees are viewed from the Space Spa).</p></details>
<details><summary>How long is the flight?<i></i></summary><p class="a">Total flight time is approximately 6 hours: about 2 hours up, 2 hours in space and 2 hours down.</p></details>
<details><summary>What does it cost to reserve a seat?<i></i></summary><p class="a">Tickets are not currently available. Please contact us to be added to the waiting list and be among the first to hear when they go on sale.</p></details>
</div>
</div>
</section>

<!-- JOIN -->
<section class="sec" id="reserve" aria-label="Join our mission" style="padding-top: 0">
<div class="join" data-reveal="">
<div class="shot"><img src="assets/invite.jpg" alt="The RISE spaceship above the curve of the Earth at sunrise"></div>
<div class="body">
<div class="mono eyebrow">Plan your flight</div>
<h2>Some things you have to see for yourself.</h2>
<p>Join our mission. We'll write when there's something real to tell you: flight news, launch invitations, and the moment seats open.</p>
<sc-if value="{{ notJoined }}" hint-placeholder-val="{{ true }}">
<form class="form" onSubmit="{{ join }}">
<div class="field"><label for="sf-email">Email</label><input id="sf-email" type="email" autocomplete="email" required=""></div>
<div class="field"><label for="sf-how">I'm interested in</label><select id="sf-how"><option>Spaceflight</option><option>Space Venue</option><option>Space Programs</option><option>Careers</option><option>Other</option></select></div>
<button class="btn solid full" type="submit">Join the list</button>
</form>
</sc-if>
<sc-if value="{{ joined }}" hint-placeholder-val="{{ false }}">
<div class="ok"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></b><span class="mono">You're on the list. We'll be in touch.</span></div>
</sc-if>
</div>
</div>
</section>

<!-- FOOTER -->
<footer class="foot">
<img class="logo" src="assets/rise-logo-nav.png" alt="RISE Space">
<nav aria-label="Footer">
<a href="index.html">Home</a>
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
<sc-if value="{{ n.ready }}" hint-placeholder-val="{{ true }}"><a href="{{ n.href }}">{{ n.label }}</a></sc-if>
<sc-if value="{{ n.soon }}" hint-placeholder-val="{{ false }}"><span>{{ n.label }}</span></sc-if>
