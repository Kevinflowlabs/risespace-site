<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RISE Space: A new kind of space platform</title>
<meta name="description" content="RISE Space flies passengers to space aboard a spaceship lifted by a Space Balloon. Hours at 100,000 ft, the largest windows ever flown to space, and a gentle, carbon-neutral flight from a marine spaceport.">
<meta name="theme-color" content="#05070C">
<meta property="og:type" content="website">
<meta property="og:title" content="RISE Space: A new kind of space platform">
<meta property="og:description" content="RISE Space flies passengers to space aboard a spaceship lifted by a Space Balloon. Hours at 100,000 ft, the largest windows ever flown to space, and a gentle, carbon-neutral flight from a marine spaceport.">
<meta property="og:image" content="assets/invite.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preload" as="image" href="assets/home3-hero-poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#05070C}
a{color:#F2EFE9}a:hover{color:#F7CC2E}
.rs{--gold:#F7CC2E;--hl:#9FD4FF;--hl-bg:rgba(120,190,255,.11);--void:#05070C;--ink:#0A0D14;--bone:#F2EFE9;--dim:#A3A8B1;--mute:#6E7480;--line:rgba(242,239,233,.13);--gut:clamp(20px,5vw,84px);--serif:'Instrument Serif','Iowan Old Style',Georgia,serif;--sans:'Geist','Helvetica Neue',Helvetica,sans-serif;--mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;background:var(--void);color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip;position:relative}
.rs *{box-sizing:border-box}
.rs img,.rs video{display:block}
.rs h1,.rs h2,.rs h3,.rs p{margin:0}
.rs .serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.rs .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.22em;font-size:11px}
.rs .gold{color:var(--gold)}
.rs .ph{font-family:var(--mono);font-size:.82em;letter-spacing:.04em;color:var(--gold);background:rgba(247,204,46,.08);outline:1px dashed rgba(247,204,46,.55);outline-offset:2px;padding:0 .3em;white-space:nowrap}

/* header */
/* ===== site navigation (shared across pages) ===== */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:28px;padding:16px var(--gut);transition:background .4s,box-shadow .4s,padding .4s;background:linear-gradient(180deg,rgba(5,7,12,.75),rgba(5,7,12,0))}
.nav[data-solid="1"]{background:rgba(5,7,12,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);padding-top:10px;padding-bottom:10px}
.nav-brand{display:flex;align-items:center;min-height:44px}
.nav-brand img{height:42px;width:auto}
.nav-links{display:flex;align-items:center;gap:6px;margin-left:18px}
.nav-link{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;font-size:13.5px;letter-spacing:.03em;text-decoration:none;color:rgba(242,239,233,.78);transition:color .25s}
.nav-link:after{content:"";position:absolute;left:12px;right:12px;bottom:8px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.16,.8,.2,1)}
a.nav-link:hover{color:var(--bone)}
a.nav-link:hover:after,.nav-link[aria-current="page"]:after{transform:scaleX(1)}
.nav-link[aria-current="page"]{color:var(--bone)}
.nav-link.is-soon{color:rgba(242,239,233,.42);cursor:default}
.nav-link em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border:1px solid rgba(242,239,233,.16);border-radius:999px;padding:2px 6px}
.nav-cta{margin-left:auto;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid rgba(247,204,46,.6);border-radius:999px;font-size:13px;letter-spacing:.04em;text-decoration:none;color:var(--bone);transition:background .25s,color .25s}
.nav-cta i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.nav-cta:hover{background:var(--gold);color:#05070C}
.nav-cta:hover i{background:#05070C;box-shadow:none}
.nav-burger{display:none;position:relative;width:46px;height:46px;border:1px solid rgba(242,239,233,.24);border-radius:50%;background:rgba(5,7,12,.4);cursor:pointer}
.nav-burger i{position:absolute;left:14px;right:14px;height:1px;background:var(--bone);transition:transform .35s,top .35s}
.nav-burger i:nth-child(1){top:19px}.nav-burger i:nth-child(2){top:26px}
.nav-burger[aria-expanded="true"] i:nth-child(1){top:22px;transform:rotate(45deg)}
.nav-burger[aria-expanded="true"] i:nth-child(2){top:22px;transform:rotate(-45deg)}
.sheet{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:96px var(--gut) 40px;background:radial-gradient(90% 60% at 80% 0%,rgba(98,180,255,.12),rgba(98,180,255,0) 60%),#05070C;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.sheet[data-open="true"]{opacity:1;visibility:visible}
.sheet a,.sheet span.s{font-family:var(--serif);font-size:clamp(38px,9vw,64px);line-height:1.15;text-decoration:none;color:var(--bone);display:flex;align-items:baseline;gap:14px;transform:translateY(16px);opacity:0;transition:transform .5s cubic-bezier(.16,.8,.2,1),opacity .5s}
.sheet[data-open="true"] a,.sheet[data-open="true"] span.s{transform:none;opacity:1}
.sheet span.s{color:rgba(242,239,233,.35)}
.sheet small{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sheet .nav-cta{margin:34px 0 0;align-self:flex-start;font-family:var(--sans);font-size:14px}
@media (max-width:980px){.nav-links,.nav>.nav-cta{display:none}.nav-burger{display:block;margin-left:auto}.nav-brand img{height:32px}}
@media (min-width:981px){.sheet{display:none}}

/* chapter rail */
.rs-rail{position:fixed;right:clamp(14px,2vw,30px);top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:4px}
.rs-rail a{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-height:30px;text-decoration:none;color:var(--mute);font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.rs-rail a span{opacity:0;transform:translateX(6px);transition:opacity .35s,transform .35s}
.rs-rail a b{display:block;width:14px;height:1px;background:currentColor;transition:width .35s,background .35s}
.rs-rail a[data-on="1"]{color:var(--bone)}
.rs-rail a[data-on="1"] span{opacity:1;transform:none}
.rs-rail a[data-on="1"] b{width:34px;background:var(--gold)}
.rs-rail:hover a span{opacity:1;transform:none}
@media (max-width:760px){.rs-rail{display:none}}

/* ===== join ===== */
.join{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(480px,100%),1fr));border:1px solid var(--line);margin-top:clamp(100px,14vh,170px)}
.join .shot{position:relative;min-height:520px;overflow:hidden}
.join .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 8s ease}
.join:hover .shot img{transform:scale(1.06)}
.join .body{padding:clamp(30px,4vw,64px);display:flex;flex-direction:column;justify-content:center;background:var(--ink)}
.join h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.2vw,70px);line-height:.96;letter-spacing:-.02em}
.join .body>p{margin-top:20px;font-size:16px;line-height:1.6;color:var(--dim);max-width:44ch}
.join .form{padding:0;background:none;border:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin-top:30px}
.join .field{display:flex;flex-direction:column;gap:8px}
.join .field label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.join .field input,.join .field select{min-height:52px;padding:0 16px;background:rgba(242,239,233,.03);border:1px solid rgba(242,239,233,.22);border-radius:2px;color:var(--bone);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .25s}
.join .field select option{background:#0A0D14}
.join .field input:focus,.join .field select:focus{border-color:var(--gold)}
.join .form .full{grid-column:1 / -1}
.join .form .btn{align-self:end}
.ok{margin-top:22px;display:flex;align-items:center;gap:12px;color:var(--gold);animation:rise .6s ease both}
.ok b{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#05070C}
.ok b svg{width:14px;height:14px}
.fine{margin-top:16px;font-size:13px;color:var(--mute)}
@media (max-width:560px){.join .form{grid-template-columns:minmax(0,1fr)}}

/* next page CTA */
.nextcta{display:flex;align-items:center;justify-content:space-between;gap:20px 40px;flex-wrap:wrap;padding:clamp(22px,3vw,34px) clamp(24px,3.4vw,44px);border:1px solid var(--line);border-left:2px solid var(--gold);background:linear-gradient(90deg,rgba(247,204,46,.07),rgba(247,204,46,0) 60%),var(--ink);text-decoration:none;color:var(--bone);transition:background .4s}
.nextcta:hover{background:linear-gradient(90deg,rgba(247,204,46,.14),rgba(247,204,46,0) 70%),var(--ink)}
.nextcta .k{display:block;color:var(--gold);margin-bottom:10px}
.nextcta .t{font-family:var(--serif);font-size:clamp(26px,2.6vw,40px);line-height:1.05}
.nextcta .go{display:inline-flex;align-items:center;gap:12px;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.nextcta .go i{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid rgba(242,239,233,.35);transition:background .3s,border-color .3s,color .3s,transform .3s}
.nextcta .go svg{width:18px;height:18px}
.nextcta:hover .go i,.nextcta:focus-visible .go i{background:var(--gold);border-color:var(--gold);color:#05070C;transform:translateX(4px)}
.nextcta:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#reserve .join{margin-top:20px}

/* sound toggle */
.snd{position:fixed;right:clamp(16px,2vw,30px);bottom:clamp(16px,3vh,30px);z-index:60;display:flex;align-items:center;justify-content:center;gap:10px;height:48px;min-width:48px;padding:0 16px;border:1px solid rgba(242,239,233,.28);border-radius:999px;background:rgba(5,7,12,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--bone);cursor:pointer;transition:border-color .25s,background .25s}
.snd:hover{border-color:var(--gold);background:rgba(5,7,12,.8)}
.snd:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.snd svg{width:18px;height:18px;flex:0 0 auto}
.snd .eq{display:flex;align-items:flex-end;gap:2px;height:12px}
.snd .eq i{display:block;width:2px;height:100%;background:var(--gold);transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
.snd .eq i:nth-child(2){animation-delay:-.35s}
.snd .eq i:nth-child(3){animation-delay:-.7s}
.snd .eq i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.snd .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
@media (max-width:760px){.snd .lbl{display:none}}
@media (prefers-reduced-motion:reduce){.snd .eq i{animation:none;transform:scaleY(.6)}}

/* scroll scenes */
.scene{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--void)}
.media,.layer{position:absolute;inset:0}
.media video,.layer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.layer{opacity:0;transition:opacity .9s ease}
.layer[data-on="1"]{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,7,12,.55) 0%,rgba(5,7,12,0) 26%,rgba(5,7,12,0) 52%,rgba(5,7,12,.86) 100%)}
.shade.side{background:linear-gradient(90deg,rgba(5,7,12,.78) 0%,rgba(5,7,12,.2) 46%,rgba(5,7,12,0) 70%),linear-gradient(180deg,rgba(5,7,12,.5),rgba(5,7,12,0) 30%,rgba(5,7,12,0) 70%,rgba(5,7,12,.7))}
.cap{position:absolute;left:var(--gut);bottom:13vh;max-width:min(680px,calc(100% - 2*var(--gut)));opacity:0;transform:translateY(30px);filter:blur(8px);transition:opacity .8s ease,transform 1.1s cubic-bezier(.16,.8,.2,1),filter .8s ease;pointer-events:none;z-index:5}
.cap[data-on="1"]{opacity:1;transform:none;filter:blur(0)}
.cap.right{left:auto;right:calc(var(--gut) + 40px);text-align:left}
.cap .mono{color:var(--gold);display:flex;align-items:center;gap:14px;margin-bottom:22px}
.cap .mono:before{content:"";width:28px;height:1px;background:var(--gold)}
.cap h2{font-family:var(--serif);font-weight:400;font-size:clamp(46px,6.6vw,108px);line-height:.94;letter-spacing:-.015em;text-wrap:balance}
.cap p{margin-top:22px;font-size:clamp(16px,1.3vw,19px);line-height:1.55;color:rgba(242,239,233,.8);max-width:44ch;text-wrap:pretty}
@media (max-width:760px){.cap,.cap.right{left:var(--gut);right:var(--gut);bottom:10vh}}

/* corner brackets */
.brk{position:absolute;inset:clamp(70px,9vh,96px) var(--gut) clamp(24px,4vh,40px);pointer-events:none;z-index:4}
.brk i{position:absolute;width:18px;height:18px;border-color:rgba(242,239,233,.45);border-style:solid;border-width:0}
.brk i:nth-child(1){left:0;top:0;border-left-width:1px;border-top-width:1px}
.brk i:nth-child(2){right:0;top:0;border-right-width:1px;border-top-width:1px}
.brk i:nth-child(3){left:0;bottom:0;border-left-width:1px;border-bottom-width:1px}
.brk i:nth-child(4){right:0;bottom:0;border-right-width:1px;border-bottom-width:1px}
.tag{position:absolute;z-index:6;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(242,239,233,.62);display:flex;gap:18px;align-items:center}
.tag.tl{left:calc(var(--gut) + 30px);top:calc(clamp(70px,9vh,96px) + 4px)}
.tag.br{right:calc(var(--gut) + 150px);bottom:calc(clamp(24px,4vh,40px) + 4px)}
.tag .live{display:inline-flex;align-items:center;gap:8px;color:var(--gold)}
.tag .live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.scrollbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(242,239,233,.08);z-index:7}
.scrollbar i{display:block;height:100%;width:calc(var(--p,0) * 100%);background:var(--gold)}

/* hangar */
#hangar .media video{transform:scale(calc(1.06 - .06 * var(--open,0)))}
#hangar .shade{opacity:var(--open,0)}
.veil{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(60% 55% at 50% 48%,rgba(5,7,12,.62),rgba(5,7,12,.28) 70%),linear-gradient(180deg,rgba(5,7,12,.55),rgba(5,7,12,0) 30%,rgba(5,7,12,0) 70%,rgba(5,7,12,.6));opacity:calc(1 - var(--logo,0))}
.mark{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(36px,7vh,70px);opacity:calc(1 - var(--logo,0));transform:translate3d(0,calc(var(--logo,0) * -8vh),0) scale(calc(1 + var(--logo,0) * .05));pointer-events:none}
.mark img{width:clamp(250px,36vw,580px);height:auto;filter:drop-shadow(0 0 40px rgba(247,204,46,.18)) drop-shadow(0 12px 40px rgba(0,0,0,.7))}
.cue{display:flex;flex-direction:column;align-items:center;gap:14px;color:rgba(242,239,233,.7)}
.cue i{display:block;width:1px;height:44px;background:linear-gradient(180deg,var(--gold),rgba(247,204,46,0));animation:cue 2.2s cubic-bezier(.6,0,.3,1) infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.hero-cap{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 var(--gut) 14vh;text-align:center;opacity:0;transform:translateY(30px);filter:blur(10px);transition:opacity 1s ease,transform 1.2s cubic-bezier(.16,.8,.2,1),filter 1s;pointer-events:none}
.hero-cap[data-on="1"]{opacity:1;transform:none;filter:blur(0)}
.hero-cap h1{font-family:var(--serif);font-weight:400;font-size:clamp(68px,11.5vw,200px);line-height:.86;letter-spacing:-.02em}
.hero-cap h1 em{font-style:italic;color:var(--gold)}
.hero-cap p{margin-top:26px;font-size:clamp(16px,1.4vw,20px);color:rgba(242,239,233,.82)}

/* opening: earth reveal */
.ostage{background:radial-gradient(120% 80% at 50% 110%,#08101f 0%,#05070C 55%)}
.stars{position:absolute;inset:0;pointer-events:none;transform:translate3d(0,calc(var(--cam,0) * -5vh),0);opacity:calc(.35 + .65 * var(--line,0))}
.stars i{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%}

.mk:before{content:"";width:22px;height:1px;background:#9FC8E0}
.ind{position:absolute;left:-6px;bottom:calc(var(--alt,0) * 100%);width:13px;height:13px;margin-bottom:-6px;border-radius:50%;border:1px solid var(--gold);background:rgba(247,204,46,.25);box-shadow:0 0 18px var(--gold)}
.tele{position:absolute;z-index:6;left:var(--gut);bottom:clamp(22px,4vh,40px);display:grid;grid-template-columns:repeat(4,auto);gap:0;border:1px solid var(--line);background:rgba(5,7,12,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tele > div{padding:12px 20px;border-right:1px solid var(--line)}
.tele > div:last-child{border-right:0}
.tele .k{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-bottom:6px}
.tele .v{font-family:var(--mono);font-size:clamp(15px,1.4vw,20px);color:var(--bone);font-variant-numeric:tabular-nums;white-space:nowrap}
.tele .v.big{color:var(--gold)}
.lcard{position:absolute;z-index:6;right:calc(var(--gut) + 40px);top:50%;width:min(470px,40vw);transform:translateY(calc(-50% + 30px));opacity:0;filter:blur(8px);transition:opacity .8s,transform 1s cubic-bezier(.16,.8,.2,1),filter .8s;pointer-events:none}
.lcard[data-on="1"]{opacity:1;transform:translateY(-50%);filter:blur(0)}
.lcard .mono{color:#9FC8E0;margin-bottom:20px;display:block}
.lcard .n{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:14px;display:block}
.lcard h3{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.6vw,76px);line-height:.95;letter-spacing:-.015em}
.lcard p{margin-top:20px;font-size:clamp(15px,1.2vw,18px);line-height:1.6;color:rgba(242,239,233,.82)}
@media (max-width:900px){
.alti{width:46px;top:96px;bottom:auto;height:42vh}
.alti .mk{display:none}
.lcard{left:calc(var(--gut) + 64px);right:var(--gut);width:auto;top:96px;transform:translateY(30px)}
.lcard[data-on="1"]{transform:none}
.lcard h3{font-size:38px}
.tele{grid-template-columns:repeat(2,auto);right:var(--gut)}
.tele > div:nth-child(2){border-right:0}
.tele > div:nth-child(-n+2){border-bottom:1px solid var(--line)}
}

/* full-bleed banner */
.banner{position:relative;height:88vh;min-height:520px;overflow:hidden}
.banner video,.banner > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .tag.bl{left:calc(var(--gut) + 2px);bottom:calc(clamp(24px,4vh,40px) + 4px)}
.banner .say h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5.4vw,92px);line-height:.98;letter-spacing:-.015em;max-width:18ch;text-wrap:balance}
.banner .say h2 em{font-style:italic;color:var(--gold)}
.banner .shade{background:linear-gradient(180deg,rgba(5,7,12,.7),rgba(5,7,12,.1) 30%,rgba(5,7,12,.2) 60%,rgba(5,7,12,.92))}
.banner .say{position:absolute;left:var(--gut);right:var(--gut);bottom:12vh}
.banner .say p{font-family:var(--serif);font-size:clamp(40px,5.4vw,92px);line-height:.98;letter-spacing:-.015em;max-width:18ch;text-wrap:balance}

/* sections */
.sec{padding:clamp(100px,16vh,180px) var(--gut)}
.sec-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:30px 60px;align-items:end;margin-bottom:clamp(50px,8vh,90px)}
.sec-head .mono{color:var(--gold);display:flex;align-items:center;gap:14px;margin-bottom:24px}
.sec-head .mono:before{content:"";width:28px;height:1px;background:var(--gold)}
.sec-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5.6vw,96px);line-height:.95;letter-spacing:-.02em;text-wrap:balance}
.sec-head p{font-size:clamp(16px,1.3vw,19px);line-height:1.6;color:var(--dim);max-width:46ch}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:0;border:1px solid var(--line)}
.split .shot{position:relative;min-height:440px;background:#000;overflow:hidden}
.split .shot video,.split .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.split .shot video.contain{object-fit:contain}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-left:1px solid var(--line)}
.spec{padding:clamp(24px,3vw,40px);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.spec:nth-child(2n){border-right:0}
.spec:nth-last-child(-n+2){border-bottom:0}
.spec .num{font-family:var(--serif);font-size:clamp(40px,4.2vw,68px);line-height:1;letter-spacing:-.02em}
.spec .num small{font-size:.45em;color:var(--dim);margin-left:4px;letter-spacing:0}
.spec p{margin-top:12px;font-size:14px;line-height:1.5;color:var(--dim);max-width:26ch}
@media (max-width:620px){.specs{grid-template-columns:minmax(0,1fr);border-left:0}.spec{border-right:0}.spec:nth-last-child(2){border-bottom:1px solid var(--line)}}
.feat{padding:clamp(28px,4vw,56px);display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line)}
.feat h3{font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.4vw,54px);line-height:1;letter-spacing:-.015em;margin-bottom:26px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5;color:#C9CDD4}
.list li:last-child{border-bottom:1px solid var(--line)}
.list li b{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.18em;color:var(--gold);padding-top:4px;min-width:26px}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:48px;padding:0 24px;border:1px solid rgba(242,239,233,.32);border-radius:999px;text-decoration:none;font-size:14px;letter-spacing:.03em;color:var(--bone);transition:background .25s,border-color .25s,color .25s;background:transparent;font-family:var(--sans);cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--bone);background:rgba(247,204,46,.08)}
.btn.solid{background:var(--gold);border-color:var(--gold);color:#05070C;font-weight:500}
.btn.solid:hover{background:#FFE07A;color:#05070C}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:20px}
.card{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--ink);overflow:hidden}
.card .img{position:relative;aspect-ratio:16/10;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.16,.8,.2,1)}
.card:hover .img img{transform:scale(1.05)}
.card .body{padding:28px 28px 30px;display:flex;flex-direction:column;flex:1}
.card .mono{color:var(--mute);margin-bottom:16px}
.card h3{font-family:var(--serif);font-weight:400;font-size:clamp(30px,2.6vw,40px);line-height:1.02;margin-bottom:14px}
.card p{font-size:15px;line-height:1.55;color:var(--dim);margin-bottom:26px}
.card .btn{margin-top:auto;align-self:flex-start}
a.card{text-decoration:none;color:var(--bone)}
a.card .body{border-top:2px solid var(--gold)}
a.card .hd{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
a.card p{margin-bottom:0}
a.card h3{margin:0}
a.card .go{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1px solid rgba(242,239,233,.35);display:inline-flex;align-items:center;justify-content:center;transition:background .3s,border-color .3s,color .3s,transform .3s}
a.card .go svg{width:18px;height:18px}
a.card:hover .go,a.card:focus-visible .go{background:var(--gold);border-color:var(--gold);color:#05070C;transform:translateX(4px)}
a.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.statement .big.long{font-size:clamp(34px,4.6vw,78px);line-height:1.02;max-width:22ch;color:rgba(242,239,233,.7)}
.statement .big.long b{font-weight:400;color:var(--bone)}
.statement .lede.big2{font-family:var(--serif);font-size:clamp(24px,2.4vw,38px);line-height:1.15;color:var(--bone);max-width:26ch;margin-top:clamp(28px,4vh,44px);padding-top:26px;border-top:1px solid rgba(242,239,233,.22)}
.statement .lede.big2 em{font-style:italic;color:var(--gold)}
.shot.wide{position:relative;aspect-ratio:21/9;border:1px solid var(--line);overflow:hidden;background:#000}
.shot.wide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media (max-width:760px){.shot.wide{aspect-ratio:4/3}}
.sec-head .textlink{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(247,204,46,.45)}
.sec-head .textlink:hover{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chips .hl{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:0;border-radius:3px;background:var(--hl-bg);color:var(--hl);font-size:12.5px;letter-spacing:.01em;line-height:1.3}
.chips .hl:before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.8}

/* record */
.recbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:clamp(60px,9vh,100px)}
.recbar > div{padding:30px 24px 30px 0}
.recbar .num{font-family:var(--serif);font-size:clamp(38px,3.6vw,58px);line-height:1;letter-spacing:-.02em}
.recbar .num .ph{font-size:.4em;white-space:normal;display:inline-block;line-height:1.3}
.recbar p{margin-top:10px;font-size:14px;line-height:1.5;color:var(--dim);max-width:28ch}
.records{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media (min-width:640px){.records{grid-template-columns:repeat(2,minmax(0,1fr))}.records .rec:first-child{grid-column:span 2}}
@media (min-width:1100px){.records{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rec{position:relative;background:var(--void);overflow:hidden;display:flex;flex-direction:column}
.rec .ph-img{position:relative;height:clamp(220px,19vw,290px);overflow:hidden;background:#0b0f18}
.rec .ph-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.16,.8,.2,1)}
.rec:hover .ph-img img{transform:scale(1.04)}
.rec .t{flex:1;padding:22px 26px 28px;border-top:2px solid var(--gold);background:var(--ink)}
.rec .num{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.rec h3{font-family:var(--serif);font-weight:400;font-size:clamp(24px,1.9vw,30px);line-height:1.1;margin-top:12px;text-wrap:balance}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:28px;margin-top:clamp(70px,10vh,120px)}
.person img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .6s}
.person:hover img{filter:grayscale(0)}
.person h3{font-family:var(--serif);font-weight:400;font-size:28px;margin-top:18px}
.person p{font-size:13px;color:var(--dim);margin-top:6px}

/* reserve */
.reserve{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));border:1px solid var(--line)}
.reserve .shot{position:relative;min-height:560px;overflow:hidden}
.reserve .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reserve .shot .shade{background:linear-gradient(180deg,rgba(5,7,12,0) 40%,rgba(5,7,12,.9))}
.reserve .shot .say{position:absolute;left:clamp(24px,3vw,44px);right:clamp(24px,3vw,44px);bottom:clamp(24px,3vw,44px)}
.reserve .shot .say p{font-family:var(--serif);font-size:clamp(32px,3vw,46px);line-height:1.02}
.form{padding:clamp(28px,4vw,60px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px;align-content:center;background:var(--ink)}
.form .full{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.field input,.field select{min-height:50px;padding:0 16px;background:rgba(242,239,233,.03);border:1px solid rgba(242,239,233,.2);border-radius:2px;color:var(--bone);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .25s}
.field select option{background:#0A0D14}
.field input:focus,.field select:focus{border-color:var(--gold)}
.opt{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--dim);min-height:44px}
.opt input{width:18px;height:18px;accent-color:#F7CC2E}
.form .fine{font-size:13px;line-height:1.6;color:var(--mute)}
@media (max-width:620px){.form{grid-template-columns:minmax(0,1fr)}}
/* home video hero */
.vhero .stage{background:#000}
.vhero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vhero .vshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,7,12,.55) 0%,rgba(5,7,12,0) 24%,rgba(5,7,12,0) 48%,rgba(5,7,12,.82) 100%),linear-gradient(90deg,rgba(5,7,12,.45),rgba(5,7,12,0) 55%)}
.vhead{position:absolute;z-index:5;left:var(--gut);right:var(--gut);bottom:clamp(90px,15vh,150px);max-width:min(860px,calc(100% - 2*var(--gut)));animation:rise 1.4s .3s cubic-bezier(.16,.8,.2,1) both}
.vhead h1{font-family:var(--serif);font-weight:400;font-size:clamp(50px,7.4vw,128px);line-height:.92;letter-spacing:-.02em;text-wrap:balance}
.vhead h1 em{font-style:italic;color:var(--gold)}
.vhead p{margin-top:24px;font-size:clamp(16px,1.35vw,20px);line-height:1.55;color:rgba(242,239,233,.84);max-width:40ch}
.vhero .cue{position:absolute;z-index:5;left:50%;bottom:clamp(20px,4vh,36px);transform:translateX(-50%)}
.vhero .tag.br{bottom:calc(clamp(24px,4vh,40px) + 4px)}
@media (max-width:760px){.vhero .cue{display:none}.vhero .tag.br{right:var(--gut);left:var(--gut);justify-content:flex-start;bottom:20px;font-size:9px}.vhead{bottom:64px}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.mref{position:absolute;right:var(--gut);bottom:clamp(28px,5vh,48px);z-index:1;color:rgba(242,239,233,.6);display:flex;align-items:center;gap:10px}
.mref:before{content:"";width:18px;height:1px;background:var(--gold)}
.shot .ref{position:absolute;left:18px;bottom:16px;z-index:1;color:rgba(242,239,233,.78);display:flex;align-items:center;gap:10px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.shot .ref:before{content:"";width:18px;height:1px;background:var(--gold)}
.feat .sub{font-size:clamp(16px,1.3vw,19px);line-height:1.6;color:#C9CDD4;max-width:40ch}
/* quotes ticker */
.quotes{position:relative;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--ink);padding:clamp(30px,5vh,46px) 0}
.quotes:before,.quotes:after{content:"";position:absolute;top:0;bottom:0;width:min(160px,14vw);z-index:1;pointer-events:none}
.quotes:before{left:0;background:linear-gradient(90deg,var(--ink),rgba(10,13,20,0))}
.quotes:after{right:0;background:linear-gradient(270deg,var(--ink),rgba(10,13,20,0))}
.qtrack{display:flex;width:max-content;animation:qscroll 70s linear infinite}
.quotes:hover .qtrack{animation-play-state:paused}
.q{display:flex;align-items:baseline;gap:18px;padding:0 clamp(28px,3vw,48px);white-space:nowrap;border-right:1px solid var(--line)}
.q p{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.2vw,34px);line-height:1.2;color:var(--bone)}
.q p:before{content:"\201C";color:var(--gold)}
.q p:after{content:"\201D";color:var(--gold)}
.q span{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.q span b{font-weight:400;color:var(--gold)}
.qtrack .dup{display:contents}
@keyframes qscroll{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.qtrack{animation:none;flex-wrap:wrap;width:auto;row-gap:20px}.qtrack .dup{display:none}.q{white-space:normal}}
.story{text-decoration:none}
.story .play{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(5,7,12,.45);border:1px solid rgba(242,239,233,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--bone);transition:transform .4s cubic-bezier(.16,.8,.2,1),background .3s,border-color .3s}
.story .play svg{width:26px;height:26px;margin-left:4px}
.story:hover .play,.story:focus-visible .play{transform:scale(1.08);background:var(--gold);border-color:var(--gold);color:#05070C}
.story .more{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.story:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:18px}
.story{position:relative;border:1px solid var(--line);background:var(--ink);overflow:hidden;color:var(--bone);display:flex;flex-direction:column}
.story .img{position:relative;aspect-ratio:16/10;overflow:hidden;background:#0b0f18}
.story .img img,.story .img video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.16,.8,.2,1)}
.story:hover .img img,.story:hover .img video{transform:scale(1.05)}
.story .t{padding:26px 26px 30px}
.story .mono{color:var(--mute)}
.story h3{font-family:var(--serif);font-weight:400;font-size:clamp(26px,2.2vw,34px);line-height:1.08;margin-top:12px}
.press{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:30px 60px;align-items:end;padding:clamp(40px,6vw,80px);border:1px solid var(--line);background:radial-gradient(80% 120% at 100% 0%,rgba(247,204,46,.07),rgba(247,204,46,0) 60%),var(--ink)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:26px 40px;padding:70px var(--gut) 40px;border-top:1px solid var(--line)}
.foot img{height:40px;width:auto;margin-right:auto}
.foot nav{display:flex;flex-wrap:wrap;gap:8px 28px}
.foot nav a{font-size:14px;text-decoration:none;color:var(--dim);padding:10px 0}
.foot nav a:hover{color:var(--bone)}
.legal{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:24px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:30px;border-top:1px solid var(--line)}
.legal a{color:var(--mute);text-decoration:none}
.legal a:hover{color:var(--bone)}
.social{flex:0 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:28px;border-top:1px solid var(--line)}
.social .mono{color:var(--mute);margin-right:10px}
.soc{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid rgba(242,239,233,.2);color:var(--dim);text-decoration:none;transition:color .25s,border-color .25s,background .25s,transform .25s}
.soc svg{width:18px;height:18px}
.soc:hover{color:#05070C;background:var(--gold);border-color:var(--gold);transform:translateY(-2px)}
.soc.todo{cursor:default}
.social + .legal{border-top:0;padding-top:20px}
@media (max-width:560px){.social .mono{flex:0 0 100%;margin:0 0 6px}}
@media (prefers-reduced-motion:reduce){.cue i,.tag .live:before{animation:none}.cap,.layer,.lcard,.hero-cap,.panel{transition-duration:.01s}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="rs" ref="{{ setRoot }}" style="--gold: {{ accent }}">

<header class="nav" data-solid="0">
<a class="nav-brand" href="index.html" aria-label="RISE Space home"><img src="assets/rise-logo-nav.png" alt="RISE Space"></a>
<nav class="nav-links" aria-label="Primary">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
<sc-if value="{{ n.ready }}" hint-placeholder-val="{{ true }}"><a class="nav-link" href="{{ n.href }}" aria-current="{{ n.current }}">{{ n.label }}</a></sc-if>
<sc-if value="{{ n.soon }}" hint-placeholder-val="{{ false }}"><span class="nav-link is-soon" aria-disabled="true">{{ n.label }}<em>Soon</em></span></sc-if>
</sc-for>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false, joined: false, soundOn: true, playing: false, menuOpen: false };
    this.toggleMenu = () => this.setState({ menuOpen: !this.state.menuOpen });
    this.closeMenu = () => this.setState({ menuOpen: false });
    this.root = null;
    this.frame = 0;
    this.setRoot = (el) => { this.root = el; if (el) this.collect(); };
    this.tick = this.tick.bind(this);
    this.unlock = this.unlock.bind(this);
    this.toggleSound = () => {
      const P = this.snd; if (!P) return;
      P.setOn(!(P.on && !P.a.paused));
    };
    this.join = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ joined: true }); };
    this.submit = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); };
  }

  componentDidMount() {
    this.win = (this.root && this.root.ownerDocument && this.root.ownerDocument.defaultView) || window;
    this.collect();
    this.win.addEventListener('pointerdown', this.unlock, { passive: true });
    this.win.addEventListener('touchstart', this.unlock, { passive: true });
    this.onIntent = this.onIntent.bind(this);
    this.onScrollEvt = () => {
      const g = this.glide;
      if (g && Math.abs(g.sc.scrollTop - g.expect) < 4) return;
      this.lastNative = performance.now();
    };
    this.win.addEventListener('scroll', this.onScrollEvt, { capture: true, passive: true });
    ['wheel', 'keydown', 'pointerdown'].forEach((ev) => this.win.addEventListener(ev, this.onIntent, { capture: true, passive: false }));
    ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach((ev) => this.win.addEventListener(ev, this.onIntent, { capture: true, passive: true }));
    this.raf = this.win.requestAnimationFrame(this.tick);
    this.audioMount();
  }

  componentWillUnmount() {
    if (this.win) {
      this.win.cancelAnimationFrame(this.raf);
      this.win.removeEventListener('pointerdown', this.unlock);
      this.win.removeEventListener('touchstart', this.unlock);
      ['wheel', 'keydown', 'pointerdown', 'touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach((ev) => this.win.removeEventListener(ev, this.onIntent, true));
      this.win.removeEventListener('scroll', this.onScrollEvt, true);
    }
    this.audioUnmount();
  }

  // ---- Background music. One shared player for the whole site: every page's sound button
  // controls the same track (a master mute), so the song can never play twice at once.
  // It starts on the visitor's first scroll, remembers mute, and carries on between pages.
  player() {
    let host = this.win;
    try { while (host.parent && host.parent !== host) { if (!host.parent.document) break; host = host.parent; } } catch (e) {}
    if (!host.__riseSound) {
      const el = this.root && this.root.querySelector('audio[data-bg]');
      const a = new host.Audio(); a.src = el ? el.src : ''; a.loop = true; a.preload = 'auto'; a.volume = 0;
      const P = { a, subs: [], on: true, armed: false, fadeT: null };
      const ss = (k, v) => { try { if (v === undefined) return host.sessionStorage.getItem(k); host.sessionStorage.setItem(k, v); } catch (e) {} return null; };
      try { if (host.localStorage.getItem('rise-sound') === 'off') P.on = false; } catch (e) {}
      if (ss('rise-sound-on') === '1') P.armed = true;
      a.addEventListener('loadedmetadata', () => { const t = parseFloat(ss('rise-sound-t')); if (t > 0 && t < (a.duration || Infinity)) { try { a.currentTime = t; } catch (e) {} } }, { once: true });
      P.emit = () => P.subs.slice().forEach((f) => f());
      a.addEventListener('playing', () => { ss('rise-sound-on', '1'); P.emit(); });
      a.addEventListener('pause', P.emit);
      const save = () => { if (!a.paused) ss('rise-sound-t', String(a.currentTime)); };
      setInterval(save, 1000);
      host.addEventListener('pagehide', save);
      P.fadeIn = () => {
        if (!P.on) return;
        if (a.paused) { a.volume = 0; const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); }
        clearInterval(P.fadeT);
        P.fadeT = setInterval(() => { if (a.paused) return; a.volume = Math.min(0.39, a.volume + 0.03); if (a.volume >= 0.39) clearInterval(P.fadeT); }, 60);
      };
      P.setOn = (v) => {
        P.on = v;
        try { host.localStorage.setItem('rise-sound', v ? 'on' : 'off'); } catch (e) {}
        if (v) { P.armed = true; P.fadeIn(); } else { clearInterval(P.fadeT); a.pause(); ss('rise-sound-on', '0'); }
        P.emit();
      };
      host.__riseSound = P;
    }
    return host.__riseSound;
  }

  audioMount() {
    const P = this.player(); this.snd = P;
    const el = this.root && this.root.querySelector('audio[data-bg]');
    if (el) { el.preload = 'none'; try { el.pause(); } catch (e) {} }
    this.syncSound = () => this.setState({ soundOn: P.on, playing: !P.a.paused });
    P.subs.push(this.syncSound); this.syncSound();
    this.mountedAt = Date.now();
    this.audioEvents = ['scroll', 'wheel', 'touchmove', 'keydown', 'pointerdown', 'touchend'];
    this.startAudio = this.startAudio.bind(this);
    this.audioEvents.forEach((ev) => this.win.addEventListener(ev, this.startAudio, { capture: true, passive: true }));
  }

  audioUnmount() {
    if (this.win && this.audioEvents) this.audioEvents.forEach((ev) => this.win.removeEventListener(ev, this.startAudio, true));
    const P = this.snd; if (!P) return;
    P.subs = P.subs.filter((f) => f !== this.syncSound);
    if (!P.subs.length) P.a.pause();
  }

  startAudio(e) {
    const P = this.snd;
    if (!P || !P.on || !e) return;
    if (e.target && e.target.closest && e.target.closest('[data-audio-btn]')) return;
    if (!P.a.paused) return;
    const scrollKeys = [' ', 'PageDown', 'PageUp', 'ArrowDown', 'ArrowUp', 'End', 'Home'];
    const passive = e.type === 'scroll' || e.type === 'wheel' || e.type === 'touchmove';
    if (passive && Date.now() - this.mountedAt < 600) return;
    if (passive || (e.type === 'keydown' && scrollKeys.indexOf(e.key) > -1)) P.armed = true;
    if (!P.armed) return;
    if (passive) { if (Date.now() - (this.lastTry || 0) < 700) return; this.lastTry = Date.now(); }
    P.fadeIn();
  }

  unlock() {
    if (this.unlocked || !this.scenes) return;
    this.unlocked = true;
    this.scenes.forEach((s) => s.scrubs.forEach((o) => {
      const v = o.v; const pr = v.play && v.play();
      if (pr && pr.then) pr.then(() => v.pause()).catch(() => {});
    }));
  }

  collect() {
    const root = this.root; if (!root) return;
    const nums = (s) => String(s || '').split(',').map(parseFloat);
    this.scenes = Array.prototype.map.call(root.querySelectorAll('[data-scene]'), (el) => {
      const vars = String(el.getAttribute('data-vars') || '').split(';').filter(Boolean).map((x) => {
        const parts = x.split(':'); const r = nums(parts[1]); return { name: '--' + parts[0].trim(), a: r[0], b: r[1] };
      });
      const q = (sel) => Array.prototype.slice.call(el.querySelectorAll(sel));
      const scrubs = q('video[data-scrub]').map((v) => {
        v.muted = true; v.playsInline = true; v.setAttribute('playsinline', '');
        const mp = v.getAttribute('data-map'); const map = mp ? mp.split(',').map((x) => x.split(':').map(parseFloat)) : null;
        return { v, map, a: +v.getAttribute('data-a'), b: +v.getAttribute('data-b'), t0: +v.getAttribute('data-t0'), t1: +v.getAttribute('data-t1'), alt: v.hasAttribute('data-alt') };
      });
      return {
        el, id: el.getAttribute('data-scene'), stage: el.querySelector('.stage'), vars, scrubs,
        ranges: q('[data-range]').map((n) => { const r = nums(n.getAttribute('data-range')); return { n, a: r[0], b: r[1] }; }),
        ats: q('[data-at]').map((n) => ({ n, at: parseFloat(n.getAttribute('data-at')) })),
        alts: q('[data-alt-range]').map((n) => { const r = nums(n.getAttribute('data-alt-range')); return { n, a: r[0], b: r[1] }; }),
        count: el.querySelector('[data-count]'),
        tel: { ft: el.querySelector('[data-tel="ft"]'), km: el.querySelector('[data-tel="km"]'), temp: el.querySelector('[data-tel="temp"]'), air: el.querySelector('[data-tel="air"]') }
      };
    });
    this.rail = Array.prototype.slice.call(root.querySelectorAll('[data-ch]'));
    Array.prototype.forEach.call(root.querySelectorAll('video[data-loop]'), (v) => {
      v.muted = true; v.loop = true; v.playsInline = true; v.setAttribute('playsinline', '');
      const pr = v.play && v.play(); if (pr && pr.catch) pr.catch(() => {});
    });
  }

  // ---- Auto-scroll: once the visitor scrolls down inside a video section, the page
  // glides through that section on its own at a steady pace. Scrolling up stops it.
  autoOn() {
    if ((this.props.autoScroll ?? true) === false) return false;
    try { if (this.win.matchMedia('(prefers-reduced-motion: reduce)').matches) return false; } catch (e) {}
    return true;
  }

  getScroller() {
    const doc = this.root.ownerDocument;
    let el = this.root.parentElement;
    while (el && el !== doc.body && el !== doc.documentElement) {
      const cs = this.win.getComputedStyle(el);
      if (/(auto|scroll)/.test(cs.overflowY) && el.scrollHeight > el.clientHeight + 4) return el;
      el = el.parentElement;
    }
    return doc.scrollingElement || doc.documentElement;
  }

  sceneToGlide() {
    if (!this.scenes) return null;
    for (const s of this.scenes) {
      const r = s.el.getBoundingClientRect();
      const sh = (s.stage && s.stage.getBoundingClientRect().height) || this.win.innerHeight;
      if (r.top <= 4 && r.bottom - sh > 12) return s;
    }
    return null;
  }

  startGlide(s) {
    const sc = this.getScroller();
    const before = sc.scrollTop;
    sc.scrollTop = before + 1;
    if (sc.scrollTop === before) return false;
    this.glide = { s, sc, v: 0, boost: 0, pos: sc.scrollTop, expect: sc.scrollTop, last: performance.now() };
    return true;
  }

  stopGlide() { this.glide = null; this.autoArmed = false; }

  // Touch screens: never fight the browser's own scrolling. A finger on the glass pauses the
  // glide and the visitor's swipe (with its natural momentum) moves the page; once the page
  // settles the glide picks up again on its own. A tap stops it; swiping up again resumes it.
  onTouch(e) {
    this.touchMode = true;
    if (e.type === 'touchstart') {
      const y = e.touches[0].clientY;
      this.touching = true; this.ty = y; this.tmoved = 0;
      this.wasGliding = !!this.glide; this.glide = null;
      return;
    }
    if (e.type === 'touchmove') {
      const y = e.touches[0].clientY; const d = (this.ty == null ? y : this.ty) - y;
      this.tmoved = (this.tmoved || 0) + Math.abs(d); this.ty = y;
      if (d > 1) this.autoArmed = true;
      else if (d < -1) this.autoArmed = false;
      this.lastNative = performance.now();
      return;
    }
    // touchend / touchcancel
    this.touching = false;
    this.lastNative = performance.now();
    if ((this.tmoved || 0) < 10) {
      const t = e.target;
      const ui = t && t.closest && t.closest('a,button,input,select,textarea,label,[data-audio-btn]');
      if (!ui) this.autoArmed = false;        // a tap on the page stops the glide
    }
  }

  maybeResume() {
    if (!this.touchMode || this.glide || !this.autoArmed || this.touching) return;
    if (performance.now() - (this.lastNative || 0) < 200) return;   // wait for momentum to settle
    const s = this.sceneToGlide();
    if (s && this.startGlide(s)) this.glide.v = 0;
  }

  // Extra distance from the visitor's own scrolling: eased in on top of the steady glide.
  pushGlide(px) { if (this.glide) this.glide.boost = Math.min(this.glide.boost + px, this.win.innerHeight * 3); }

  stepGlide() {
    const g = this.glide; if (!g) return;
    const now = performance.now();
    const dt = Math.min(0.2, (now - g.last) / 1000); g.last = now;
    if (Math.abs(g.sc.scrollTop - g.expect) > 60) { this.glide = null; return; }
    const r = g.s.el.getBoundingClientRect();
    const sh = (g.s.stage && g.s.stage.getBoundingClientRect().height) || this.win.innerHeight;
    const remain = r.bottom - sh;
    if (remain <= 1) { this.glide = null; return; }
    const speed = (this.props.autoSpeed ?? 40) * sh / 100 * (parseFloat(g.s.el.getAttribute('data-glide')) || 1);
    g.v += (speed - g.v) * Math.min(1, dt * (this.touchMode ? 3 : 2.2));
    let step = g.v * dt * Math.max(0.22, Math.min(1, remain / (sh * 0.4)));
    if (g.boost > 0.5) { const take = g.boost * Math.min(1, dt * 6); g.boost -= take; step += take; } else g.boost = 0;
    if (step > remain) step = remain;
    g.pos += step;
    g.sc.scrollTop = g.pos;
    g.expect = g.sc.scrollTop;
  }

  // Scroll down: starts the glide, or speeds it up while it runs (then it eases back to normal).
  // Scroll up, a click or a tap: stops it. Scrolling down again resumes.
  onIntent(e) {
    if (!this.scenes || !this.root || !this.autoOn()) return;
    const sh = this.win.innerHeight;
    let dir = 0, px = 0;
    if (e.type === 'wheel') {
      const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? sh : 1;
      px = e.deltaY * unit; dir = px > 0 ? 1 : px < 0 ? -1 : 0;
    } else if (e.type === 'keydown') {
      const t = e.target && e.target.tagName;
      if (t && /^(INPUT|SELECT|TEXTAREA|BUTTON|A)$/.test(t)) return;
      if (e.key === 'Escape') { this.stopGlide(); return; }
      if (e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { dir = 1; px = sh * 0.85; }
      else if (e.key === 'ArrowDown') { dir = 1; px = 80; }
      else if (e.key === 'PageUp' || e.key === 'ArrowUp' || e.key === 'Home' || (e.key === ' ' && e.shiftKey)) dir = -1;
      else return;
    } else if (e.type === 'pointerdown') {
      if (e.pointerType === 'touch') return;
      if (e.target && e.target.closest && e.target.closest('a,button,input,select,textarea,label,[data-audio-btn]')) return;
      this.stopGlide(); return;
    } else if (e.type === 'touchstart' || e.type === 'touchmove' || e.type === 'touchend' || e.type === 'touchcancel') {
      this.onTouch(e); return;
    }
    if (dir < 0) { this.stopGlide(); return; }
    if (dir > 0) {
      this.autoArmed = true;
      if (this.glide) { if (e.cancelable) e.preventDefault(); this.pushGlide(px); return; }
      const s = this.sceneToGlide();
      if (s && this.startGlide(s)) { if (e.cancelable) e.preventDefault(); this.pushGlide(px); }
    }
  }

  setOn(n, on) { const val = on ? '1' : '0'; if (n._on !== val) { n._on = val; n.setAttribute('data-on', val); } }

  altAt(t) {
    const k = [[0, 0], [2.6, 1500], [3.4, 14000], [5.6, 24000], [7.2, 36000], [9.2, 50000], [11.6, 62000], [13.6, 74000], [15.8, 84000], [17.4, 97000], [18.4, 100000], [99, 100000]];
    for (let i = 1; i < k.length; i++) {
      if (t <= k[i][0]) { const a = k[i - 1], b = k[i]; return a[1] + (b[1] - a[1]) * ((t - a[0]) / (b[0] - a[0])); }
    }
    return 100000;
  }

  isa(ft) {
    const h = ft * 0.3048; let T, P;
    if (h < 11000) { T = 288.15 - 0.0065 * h; P = 101325 * Math.pow(T / 288.15, 5.25588); }
    else if (h < 20000) { T = 216.65; P = 22632.1 * Math.exp(-0.000157688 * (h - 11000)); }
    else { T = 216.65 + 0.001 * (h - 20000); P = 5474.89 * Math.pow(T / 216.65, -34.1632); }
    return { c: T - 273.15, pct: P / 101325 * 100 };
  }

  tick() {
    this.raf = this.win.requestAnimationFrame(this.tick);
    this.frame++;
    if (this.root && this.frame % 6 === 0) {
      const nav = this.root.querySelector('.nav');
      if (nav) { const solid = this.root.getBoundingClientRect().top < -40 ? '1' : '0'; if (nav.getAttribute('data-solid') !== solid) nav.setAttribute('data-solid', solid); }
    }
    if (!this.scenes || this.frame % 90 === 0) this.collect();
    if (this.glide) this.stepGlide(); else this.maybeResume();
    if (!this.scenes) return;
    const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    let active = null;
    this.scenes.forEach((s) => {
      const r = s.el.getBoundingClientRect();
      const sh = (s.stage && s.stage.getBoundingClientRect().height) || this.win.innerHeight;
      const span = r.height - sh;
      const p = span > 0 ? clamp(-r.top / span) : 0;
      const near = r.top < sh * 1.5 && r.bottom > -sh * 0.5;
      if (r.top <= sh * 0.5 && r.bottom > sh * 0.5) active = s.id;
      if (s._p === p && s._init) return;
      s._p = p; s._init = true;
      s.el.style.setProperty('--p', p.toFixed(4));
      s.vars.forEach((v) => s.el.style.setProperty(v.name, ease(clamp((p - v.a) / (v.b - v.a))).toFixed(4)));
      s.ranges.forEach((o) => this.setOn(o.n, p >= o.a && p < o.b));
      s.ats.forEach((o) => this.setOn(o.n, p >= o.at));
      if (s.count) {
        const end = 0.42; let txt;
        if (p >= end) txt = 'Liftoff';
        else txt = 'T– 00:00:' + String(Math.max(1, Math.ceil(10 * (1 - p / end)))).padStart(2, '0');
        if (s.count._t !== txt) { s.count._t = txt; s.count.textContent = txt; }
      }
      if (!near) return;
      s.scrubs.forEach((o) => {
        if (o.map) {
          const m = o.map; let t = m[m.length - 1][1];
          for (let i = 1; i < m.length; i++) { if (p <= m[i][0]) { const k = (p - m[i - 1][0]) / ((m[i][0] - m[i - 1][0]) || 1); t = m[i - 1][1] + (m[i][1] - m[i - 1][1]) * clamp(k); break; } }
          o.target = t;
        } else o.target = o.t0 + clamp((p - o.a) / (o.b - o.a)) * (o.t1 - o.t0);
      });
    });
    this.scenes.forEach((s) => {
      s.scrubs.forEach((o) => {
        const v = o.v; if (o.target == null) return;
        const d = v.duration; let tgt = o.target; if (d && tgt > d - 0.05) tgt = d - 0.05;
        o.cur = o.cur == null ? tgt : o.cur + (tgt - o.cur) * 0.16;
        if (Math.abs(o.cur - tgt) < 0.002) o.cur = tgt;
        if (v.readyState >= 1 && !v.seeking && Math.abs(v.currentTime - o.cur) > (this.touchMode ? 0.034 : 0.015)) { try { v.currentTime = o.cur; } catch (e) {} }
        if (o.alt) {
          const ft = this.altAt(o.cur);
          if (o._ft !== Math.round(ft)) {
            o._ft = Math.round(ft);
            s.el.style.setProperty('--alt', (ft / 100000).toFixed(4));
            const a = this.isa(ft);
            if (s.tel.ft) s.tel.ft.textContent = Math.round(ft / 100) * 100 >= 1000 ? (Math.round(ft / 100) * 100).toLocaleString('en-US') + ' ft' : Math.round(ft) + ' ft';
            if (s.tel.km) s.tel.km.textContent = (ft * 0.0003048).toFixed(1) + ' km';
            if (s.tel.temp) s.tel.temp.textContent = (a.c < 0 ? '−' : '') + Math.abs(Math.round(a.c)) + ' °C';
            if (s.tel.air) s.tel.air.textContent = (a.pct >= 10 ? Math.round(a.pct) : a.pct.toFixed(1)) + '%';
            s.alts.forEach((c) => this.setOn(c.n, ft >= c.a && ft < c.b));
          }
        }
      });
    });
    if (this.rail) this.rail.forEach((n) => this.setOn(n, n.getAttribute('data-ch') === active));
  }

  renderVals() {
    const pct = (ft) => (ft / 1000).toFixed(1) + '%';
    return {
      accent: this.props.accent ?? '#F7CC2E',
      firstId: 'opening',
      menuOpen: this.state.menuOpen,
      toggleMenu: this.toggleMenu,
      closeMenu: this.closeMenu,
      nav: [
        { key: 'spaceflight', label: 'Spaceflight', href: 'spaceflight.html', ready: true },
        { key: 'spaceship', label: 'Spaceship', href: 'spaceship.html', ready: true },
        { key: 'venue', label: 'Space Venue', href: 'space-venue.html', ready: true },
        { key: 'programs', label: 'Space Programs', href: 'space-programs.html', ready: true },
        { key: 'about', label: 'About', href: 'about.html', ready: true },
      ].map((n) => ({ ...n, soon: !n.ready, current: 'false' })),
      setRoot: this.setRoot,
      submit: this.submit,
      join: this.join,
      joined: this.state.joined,
      notJoined: !this.state.joined,
      sent: this.state.sent,
      toggleSound: this.toggleSound,
      soundOn: this.state.soundOn,
      soundOff: !this.state.soundOn,
      playing: !!this.state.playing,      soundLabel: this.state.soundOn ? 'Mute background music' : 'Turn background music on',
      quotes: [
        { text: 'Everybody in the world needs to see this.', who: 'William Shatner', role: 'Actor' },
        { text: 'When I first looked back at the Earth… I cried.', who: 'Alan Shepard', role: 'Apollo Astronaut' },
        { text: 'I will never be the same.', who: 'Aisha Bowe', role: 'Rocket Scientist' },
        { text: 'Heart stopping. Soul pounding. Breathtaking.', who: 'T.J. Creamer', role: 'NASA Astronaut' },
        { text: 'From here, Earth sure looks like a perfect world.', who: 'Jared Isaacman', role: 'NASA Administrator' }
      ],
      chapters: [
        { id: 'opening', n: '01', label: 'Opening' },
        { id: 'port', n: '02', label: 'Hangar' },
        { id: 'launch', n: '03', label: 'Launch' },
        { id: 'ascent', n: '04', label: 'Ascent' },
        { id: 'apogee', n: '05', label: 'Apogee' },
        { id: 'return', n: '06', label: 'Return' }
      ],
      checklist: [
        { at: 0.03, t: 'Spaceship secured on deck' },
        { at: 0.13, t: 'Space Balloon inflation' },
        { at: 0.25, t: 'Final checks · go for launch' },
        { at: 0.38, t: 'Release' }
      ],
      ticks: [0, 20000, 40000, 60000, 80000, 100000].map((ft) => ({ pos: pct(ft), label: ft === 0 ? '0' : (ft / 1000) + 'k' })),
      marks: [
        { pos: pct(35000), label: 'Airliners' },
        { pos: pct(39000), label: 'Tropopause' },
        { pos: pct(62000), label: 'Armstrong limit' },
        { pos: pct(100000), label: 'Space · apogee' }
      ],
      layers: [
        { n: '01', range: '-1,30000', alt: '0 – 39,000 ft', name: 'Troposphere', title: 'Through the weather.', body: 'Almost every cloud, storm and raindrop lives in this first layer, along with most of the air on Earth. You rise straight through it, smoothly, at about the speed of a bicycle.' },
        { n: '02', range: '30000,39000', alt: '≈ 35,000 ft', name: 'Cruising altitude', title: 'Above the airliners.', body: 'Passenger jets level off around here. You keep climbing, to nearly three times their height.' },
        { n: '03', range: '39000,50000', alt: '≈ 39,000 ft', name: 'Tropopause', title: 'Where the weather ends.', body: 'The air stops cooling at the top of the troposphere, around −56 °C. Below you, the weather. Above you, a sky that only gets darker. Inside, the cabin stays comfortable throughout.' },
        { n: '04', range: '50000,62000', alt: '≈ 50,000 – 115,000 ft', name: 'Stratosphere · Ozone layer', title: 'Inside the ozone layer.', body: 'The layer that shields Earth from ultraviolet light. Up here the air begins to warm again as you climb, and the horizon starts to curve.' },
        { n: '05', range: '62000,80000', alt: '≈ 62,000 ft', name: 'Armstrong limit', title: 'Beyond the Armstrong limit.', body: 'Above this line, water boils at body temperature. The pressurized cabin is your world now, with environmental control systems built for total passenger comfort.' },
        { n: '06', range: '80000,97000', alt: '≈ 80,000 ft', name: 'Black sky', title: 'Blue turns to black.', body: 'With less than 3% of the atmosphere left above you, there is too little air to scatter sunlight. The sky goes black in full daylight.' },
        { n: '07', range: '97000,999999', alt: '≈ 100,000 ft · 30 km', name: 'The edge of space', title: 'The edge of space.', body: 'Above about 99% of Earth’s atmosphere. The curve of the planet, the thin blue line of the sky, and the black of space, all at once.' }
      ],
      records: [
        { img: 'assets/rec-flights.jpg', alt: 'A Space Balloon launching at sunrise', stat: 'Over 100 flights', title: 'Space Balloon flights flown by team members' },
        { img: 'assets/rec-dive-centered.jpg', alt: 'A space dive from a balloon', stat: '41.5 km · 136,000 ft', title: 'Highest human flight and space dive from a balloon' },
        { img: 'assets/rec-dragon.jpg', alt: 'A balloon lifting a Dragon capsule', stat: '10,000 kg · 22,000 lb', title: 'Heaviest payload ever flown by balloon: a Dragon capsule to 45,000 ft' },
        { img: 'assets/rec-neptune.jpg', alt: 'A capsule launched from a ship at sea', stat: '6,600 kg to 30 km', title: 'Heaviest payload launched to 100,000 ft' },
        { img: 'assets/rec-capsule.jpg', alt: 'The space capsule in its hangar', stat: '2,144 cu ft', title: 'Largest-volume space capsule, with the largest windows ever flown to space' },
        { img: 'assets/rec-biosphere.jpg', alt: 'Biosphere 2 at dusk', stat: 'Two years inside', title: 'Designed, built and lived longest in Biosphere 2, the most closed bioregenerative prototype space base' },
        { img: 'assets/rec-iss.jpg', alt: 'The International Space Station', stat: '98% recovered', title: 'Technology on most U.S. crewed spacecraft, including the highest water recycle rate on the ISS' }
      ]
    };
  }
}
